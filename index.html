<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login</title>
    
    <!-- Google Font - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome untuk ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Reset CSS dan pengaturan dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background-color: #000;
            cursor: default;
        }
        
        /* Video background */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.7);
        }
        
        /* Overlay untuk memperbaiki kontras */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }
        
        /* Container untuk form login */
        .login-container {
            width: 90%;
            max-width: 400px;
            padding: 2rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        /* Efek cahaya animasi */
        .login-container::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }
        
        @keyframes shine {
            0% {
                transform: translateX(-100%) translateY(-100%) rotate(45deg);
            }
            100% {
                transform: translateX(100%) translateY(100%) rotate(45deg);
            }
        }
        
        /* Animasi fade in */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        /* Judul login dengan efek neon */
        .login-title {
            color: white;
            font-size: 2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 1.5rem;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #ff00de,
                0 0 20px #ff00de,
                0 0 25px #ff00de,
                0 0 30px #ff00de,
                0 0 35px #ff00de;
            position: relative;
            z-index: 1;
            animation: neonPulse 2s infinite;
        }
        
        @keyframes neonPulse {
            0% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 15px #ff00de,
                    0 0 20px #ff00de,
                    0 0 25px #ff00de,
                    0 0 30px #ff00de,
                    0 0 35px #ff00de;
            }
            50% {
                text-shadow: 
                    0 0 10px #fff,
                    0 0 20px #fff,
                    0 0 30px #ff00de,
                    0 0 40px #ff00de,
                    0 0 50px #ff00de,
                    0 0 60px #ff00de,
                    0 0 70px #ff00de;
            }
            100% {
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #fff,
                    0 0 15px #ff00de,
                    0 0 20px #ff00de,
                    0 0 25px #ff00de,
                    0 0 30px #ff00de,
                    0 0 35px #ff00de;
            }
        }
        
        /* Grup input */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
            z-index: 1;
        }
        
        /* Label input */
        .input-group label {
            display: block;
            color: white;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.9rem;
        }
        
        /* Input field */
        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        /* Placeholder styling */
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        /* Efek focus pada input */
        .input-group input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
            transform: scale(1.02);
        }
        
        /* Tombol show/hide password */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 38px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .toggle-password:hover {
            color: #ff6b6b;
            transform: scale(1.2);
        }
        
        /* Tombol login */
        .login-btn {
            width: 100%;
            padding: 0.8rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }
        
        /* Efek ripple pada tombol login */
        .login-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        
        .login-btn:active::before {
            width: 300px;
            height: 300px;
        }
        
        /* Efek hover pada tombol login */
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        /* Link lupa password */
        .forgot-password {
            display: block;
            text-align: center;
            color: white;
            margin-top: 1rem;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        
        .forgot-password:hover {
            color: #ff6b6b;
            transform: translateY(-2px);
        }
        
        /* Pesan error */
        .error-message {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
            animation: shake 0.5s;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }
        
        /* Halaman sukses */
        .success-page {
            display: none;
            text-align: center;
            color: white;
            padding: 2rem;
        }
        
        .success-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 
                0 0 5px #fff,
                0 0 10px #fff,
                0 0 15px #ff00de,
                0 0 20px #ff00de,
                0 0 25px #ff00de,
                0 0 30px #ff00de,
                0 0 35px #ff00de;
            animation: neonPulse 2s infinite;
        }
        
        .prank-text {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        .typing-text {
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .cursor {
            display: inline-block;
            width: 3px;
            height: 1.5rem;
            background-color: white;
            margin-left: 2px;
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
        
        /* Efek teks prank */
        .prank-effect {
            animation: textPrank 0.5s infinite;
            font-size: 1.2rem;
            margin-top: 1rem;
        }
        
        @keyframes textPrank {
            0% {
                transform: scale(1) rotate(0deg);
                color: white;
            }
            25% {
                transform: scale(1.1) rotate(2deg);
                color: #ff6b6b;
            }
            50% {
                transform: scale(0.9) rotate(-2deg);
                color: #6bffb8;
            }
            75% {
                transform: scale(1.05) rotate(1deg);
                color: #6ba3ff;
            }
            100% {
                transform: scale(1) rotate(0deg);
                color: white;
            }
        }
        
        /* Logo Telegram */
        .telegram-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: white;
            text-decoration: none;
            font-size: 1rem;
            transition: all 0.3s ease;
            z-index: 100;
        }
        
        .telegram-link:hover {
            color: #0088cc;
            transform: scale(1.05);
        }
        
        .telegram-icon {
            font-size: 1.5rem;
        }
        
        /* Responsive design */
        @media (max-width: 480px) {
            .login-container {
                width: 85%;
                padding: 1.5rem;
            }
            
            .login-title {
                font-size: 1.8rem;
            }
            
            .success-title {
                font-size: 2rem;
            }
            
            .prank-text {
                font-size: 1.5rem;
            }
            
            .typing-text {
                font-size: 1.2rem;
            }
        }
        
        /* Modal anti close */
        .anti-close-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
            text-align: center;
            padding: 2rem;
        }
        
        .anti-close-text {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-shadow: 0 0 10px #ff0000;
            animation: antiClosePulse 1s infinite;
        }
        
        @keyframes antiClosePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        .anti-close-btn {
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #ff6b6b, #ff8e53);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .anti-close-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 107, 107, 0.7);
        }
        
        /* Loading spinner */
        .loading-spinner {
            display: none;
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ff6b6b;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Overlay untuk memblokir interaksi */
        .block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: white;
        }
        
        .block-message {
            font-size: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            max-width: 80%;
        }
        
        .block-countdown {
            font-size: 3rem;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 2rem;
        }
        
        /* Efek partikel */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }
        
        .particle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            animation: float 15s infinite linear;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Video background -->
    <video autoplay muted loop id="bgVideo">
        <source src="https://files.catbox.moe/5iftav.mp4" type="video/mp4">
        Browser Anda tidak mendukung video HTML5.
    </video>
    
    <!-- Efek partikel -->
    <div class="particles" id="particles"></div>
    
    <!-- Logo Telegram -->
    <a href="https://t.me//JhonNotDev" class="telegram-link" target="_blank">
        <i class="fab fa-telegram telegram-icon"></i>
        <span>JhonNotDev</span>
    </a>
    
    <!-- Halaman Login -->
    <div class="login-container" id="loginPage">
        <h1 class="login-title">Login</h1>
        
        <form id="loginForm">
            <!-- Input Username -->
            <div class="input-group">
                <label for="email">Username</label>
                <input type="text" id="email" name="email" placeholder="Masukkan username">
                <div class="error-message" id="emailError">Username harus diisi</div>
            </div>
            
            <!-- Input Password -->
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Masukkan password">
                <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                <div class="error-message" id="passwordError">Password harus diisi</div>
            </div>
            
            <!-- Loading Spinner -->
            <div class="loading-spinner" id="loadingSpinner"></div>
            
            <!-- Tombol Login -->
            <button type="submit" class="login-btn" id="loginBtn">Login</button>
            
            <!-- Link Lupa Password -->
            <a href="#" class="forgot-password">Lupa password?</a>
        </form>
    </div>
    
    <!-- Halaman Sukses -->
    <div class="login-container success-page" id="successPage">
        <h1 class="success-title">Login Berhasil!</h1>
        
        <div class="prank-text">
            <div class="typing-text" id="typingText"></div>
            <div class="prank-effect" id="prankEffect"></div>
        </div>
    </div>
    
    <!-- Modal Anti Close -->
    <div class="anti-close-modal" id="antiCloseModal">
        <div class="anti-close-text">JANGAN TUTUP WEB NYA DONG! 😹</div>
        <button class="anti-close-btn" id="closeModalBtn">OK BOSS, GAK AKAN TUTUP!</button>
    </div>
    
    <!-- Overlay untuk memblokir interaksi -->
    <div class="block-overlay" id="blockOverlay">
        <div class="block-message">Kamu mencoba keluar dari halaman ini!<br>Tunggu sebentar ya...</div>
        <div class="block-countdown" id="blockCountdown">10</div>
    </div>
    
    <script>
        // URL untuk suara desahan
        const DESAHAN_URL = "https://files.catbox.moe/ya1wgk.mp3";
        
        // Variabel untuk fitur anti close
        let prankActive = false;
        let closeAttempts = 0;
        let blockActive = false;
        let audioElement = null;
        
        // Buat partikel
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        // Toggle password visibility
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
        
        // Form validation
        const loginForm = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const emailError = document.getElementById('emailError');
        const passwordError = document.getElementById('passwordError');
        const loginPage = document.getElementById('loginPage');
        const successPage = document.getElementById('successPage');
        const typingText = document.getElementById('typingText');
        const prankEffect = document.getElementById('prankEffect');
        const antiCloseModal = document.getElementById('antiCloseModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const loginBtn = document.getElementById('loginBtn');
        const blockOverlay = document.getElementById('blockOverlay');
        const blockCountdown = document.getElementById('blockCountdown');
        
        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            emailError.style.display = 'none';
            passwordError.style.display = 'none';
            
            let isValid = true;
            
            // Validasi username
            if (emailInput.value.trim() === '') {
                emailError.style.display = 'block';
                isValid = false;
            }
            
            // Validasi password
            if (passwordInput.value.trim() === '') {
                passwordError.style.display = 'block';
                isValid = false;
            }
            
            // Jika valid, cek kredensial khusus
            if (isValid) {
                const username = emailInput.value.trim();
                const password = passwordInput.value.trim();
                
                // Cek kredensial khusus
                if (username === "Nana" && password === "Nana001") {
                    // Tampilkan loading spinner
                    loginBtn.style.display = 'none';
                    loadingSpinner.style.display = 'block';
                    
                    setTimeout(() => {
                        // Pindah ke halaman sukses
                        loginPage.style.display = 'none';
                        successPage.style.display = 'block';
                        
                        // Aktifkan fitur prank
                        prankActive = true;
                        
                        // Putar suara desahan
                        playDesahan();
                        
                        // Tampilkan teks dengan efek mengetik
                        typeText("dengarkan suarnya 😹😹😹", typingText, function() {
                            // Setelah selesai mengetik, tampilkan efek prank
                            startPrankEffect();
                        });
                        
                        // Reset form
                        loginForm.reset();
                        loginBtn.style.display = 'block';
                        loadingSpinner.style.display = 'none';
                    }, 2000);
                } else {
                    // Tampilkan pesan error
                    emailError.textContent = "Username atau password salah";
                    emailError.style.display = 'block';
                    passwordError.textContent = "Username atau password salah";
                    passwordError.style.display = 'block';
                }
            }
        });
        
        // Fungsi untuk memutar suara desahan
        function playDesahan() {
            // Hentikan audio sebelumnya jika ada
            if (audioElement) {
                audioElement.pause();
                audioElement = null;
            }
            
            // Buat elemen audio baru
            audioElement = new Audio(DESAHAN_URL);
            audioElement.loop = true;
            audioElement.volume = 0.7;
            
            // Coba putar audio
            audioElement.play().catch(e => {
                console.log("Autoplay diblokir, memerlukan interaksi pengguna");
                
                // Tambahkan event listener untuk memutar audio setelah interaksi pengguna
                document.addEventListener('click', function playAudioOnce() {
                    audioElement.play().catch(e => {
                        console.log("Gagal memutar audio:", e);
                    });
                    document.removeEventListener('click', playAudioOnce);
                }, { once: true });
            });
        }
        
        // Fungsi untuk efek mengetik
        function typeText(text, element, callback) {
            element.innerHTML = '';
            let i = 0;
            
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                } else {
                    // Tambahkan kursor berkedip setelah selesai mengetik
                    const cursor = document.createElement('span');
                    cursor.classList.add('cursor');
                    element.appendChild(cursor);
                    
                    if (callback) callback();
                }
            }
            
            type();
        }
        
        // Fungsi untuk efek prank pada teks
        function startPrankEffect() {
            const prankMessages = [
                "awokawok 😹",
                "GIMANA DESAHANNYA?",
                "JANGAN MARAH YA! 🗿",
            ];
            
            let currentIndex = 0;
            
            // Tampilkan pesan prank bergantian
            setInterval(() => {
                prankEffect.textContent = prankMessages[currentIndex];
                currentIndex = (currentIndex + 1) % prankMessages.length;
            }, 2000);
        }
        
        // FITUR ANTI CLOSE YANG DIPERKUAT
        function setupAntiClose() {
            // Deteksi ketika user mencoba menutup tab/window
            window.addEventListener('beforeunload', function(e) {
                if (prankActive && !blockActive) {
                    e.preventDefault();
                    e.returnValue = 'Jangan tutup webnya dong!';
                    closeAttempts++;
                    
                    // Tampilkan modal setelah beberapa kali mencoba menutup
                    if (closeAttempts >= 1) {
                        // Batal menutup dan tampilkan modal
                        setTimeout(() => {
                            antiCloseModal.style.display = 'flex';
                        }, 100);
                    }
                    
                    return 'Jangan tutup webnya dong!';
                }
            });
            
            // Deteksi ketika user mencoba navigate away
            window.addEventListener('unload', function(e) {
                if (prankActive) {
                    // Buka tab baru dengan halaman yang sama
                    window.open(window.location.href, '_blank');
                }
            });
            
            // Tombol untuk menutup modal
            closeModalBtn.addEventListener('click', function() {
                antiCloseModal.style.display = 'none';
                
                // Tampilkan overlay pemblokiran
                showBlockOverlay();
            });
            
            // Fungsi untuk menampilkan overlay pemblokiran
            function showBlockOverlay() {
                blockActive = true;
                blockOverlay.style.display = 'flex';
                
                let countdown = 10;
                blockCountdown.textContent = countdown;
                
                const countdownInterval = setInterval(() => {
                    countdown--;
                    blockCountdown.textContent = countdown;
                    
                    if (countdown <= 0) {
                        clearInterval(countdownInterval);
                        blockOverlay.style.display = 'none';
                        blockActive = false;
                    }
                }, 1000);
            }
            
            // Cegah context menu (klik kanan)
            document.addEventListener('contextmenu', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah keyboard shortcuts untuk menutup tab
            document.addEventListener('keydown', function(e) {
                if (prankActive) {
                    // Cegah Ctrl+W, Ctrl+F4, Alt+F4, dll.
                    if ((e.ctrlKey && e.key === 'w') || 
                        (e.ctrlKey && e.key === 'F4') || 
                        (e.altKey && e.key === 'F4') ||
                        (e.metaKey && e.key === 'w')) {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                    
                    // Cegah F5 (refresh)
                    if (e.key === 'F5') {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                    
                    // Cegah Ctrl+R (refresh)
                    if (e.ctrlKey && e.key === 'r') {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                    
                    // Cegah Ctrl+Shift+R (hard refresh)
                    if (e.ctrlKey && e.shiftKey && e.key === 'R') {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                    
                    // Cegah Alt+Tab (mungkin tidak berfungsi di semua browser)
                    if (e.altKey && e.key === 'Tab') {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                    
                    // Cegah Escape
                    if (e.key === 'Escape') {
                        e.preventDefault();
                        antiCloseModal.style.display = 'flex';
                    }
                }
            });
            
            // Cegah klik kanan pada gambar
            document.addEventListener('dragstart', function(e) {
                if (prankActive && e.target.tagName === 'IMG') {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah select text
            document.addEventListener('selectstart', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah copy
            document.addEventListener('copy', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah cut
            document.addEventListener('cut', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah paste
            document.addEventListener('paste', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Cegah back button
            window.addEventListener('popstate', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    history.pushState(null, null, window.location.href);
                    antiCloseModal.style.display = 'flex';
                }
            });
            
            // Cegah visibility change (tab switching)
            document.addEventListener('visibilitychange', function() {
                if (prankActive && document.hidden) {
                    // Tampilkan modal ketika user mencoba beralih tab
                    setTimeout(() => {
                        antiCloseModal.style.display = 'flex';
                    }, 100);
                }
            });
            
            // Cegah mouse leave (mungkin tidak berfungsi di semua browser)
            document.addEventListener('mouseleave', function(e) {
                if (prankActive && e.clientY <= 0) {
                    // Tampilkan modal ketika mouse meninggalkan jendela
                    setTimeout(() => {
                        antiCloseModal.style.display = 'flex';
                    }, 100);
                }
            });
            
            // Cegah window blur (fokus berpindah dari jendela)
            window.addEventListener('blur', function() {
                if (prankActive) {
                    // Tampilkan modal ketika jendela kehilangan fokus
                    setTimeout(() => {
                        antiCloseModal.style.display = 'flex';
                    }, 100);
                }
            });
            
            // Cegah window focus (untuk memastikan jendela tetap aktif)
            window.addEventListener('focus', function() {
                if (prankActive) {
                    // Pastikan jendela tetap di depan
                    window.focus();
                }
            });
            
            // Cegah resize window
            window.addEventListener('resize', function() {
                if (prankActive) {
                    // Kembalikan ukuran jendela ke ukuran sebelumnya
                    setTimeout(() => {
                        window.resizeTo(window.outerWidth, window.outerHeight);
                    }, 100);
                }
            });
            
            // Cegah scroll
            document.addEventListener('wheel', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });
            
            // Cegah touch move (untuk perangkat mobile)
            document.addEventListener('touchmove', function(e) {
                if (prankActive) {
                    e.preventDefault();
                    return false;
                }
            }, { passive: false });
        }
        
        // Inisialisasi fitur anti close
        setupAntiClose();
        
        // Buat partikel saat halaman dimuat
        createParticles();
        
        // Cegah back button dengan history manipulation
        history.pushState(null, null, window.location.href);
    </script>
</body>
</html>
